network:
  version: 2
  ethernets:
    enp1s0:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
    enp2s0:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
  bridges:
    spbr0:
      interfaces: [enp1s0, enp2s0]
      macaddress: 52:54:00:aa:bb:01
      dhcp4: false
      dhcp6: false
      accept-ra: false
      addresses: [192.0.2.10/24]
      routes:
        - to: 0.0.0.0/0
          via: 192.0.2.1
      nameservers:
        addresses: [192.0.2.1]
      parameters:
        stp: true
        forward-delay: 4

network:
  version: 2
  ethernets:
    enp1s0:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
    enp2s0:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
  bridges:

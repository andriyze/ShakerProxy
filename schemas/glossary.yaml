{
  "schema": 1,
  "revision": "2026-09-29.2",
  "terms": [
    {"id":"supported","label":"Supported","definition":"Release-gated behavior that passed the declared platform and feature acceptance matrix."},
    {"id":"experimental","label":"Experimental","definition":"Available behind an explicit gate; behavior may change and release evidence is incomplete."},
    {"id":"capture-only","label":"Capture-only","definition":"Packets or bounded metadata are visible, but content is not decrypted and stronger classification is not claimed."},
    {"id":"unavailable","label":"Unavailable","definition":"The product does not expose this capability in the current release."},
    {"id":"captured","label":"Captured","definition":"Raw packets were observed and stored or summarized."},
    {"id":"classified","label":"Classified","definition":"Protocol or destination metadata was identified without content access."},
    {"id":"intercepted","label":"Intercepted","definition":"Traffic was routed through a controlled proxy or resolver."},
    {"id":"decrypted","label":"Decrypted","definition":"Plaintext application content was recovered."},
    {"id":"bypassed","label":"Bypassed","definition":"Policy intentionally passed the flow without interception."},
    {"id":"blocked","label":"Blocked","definition":"Policy dropped or rejected the flow."},
    {"id":"failed","label":"Failed","definition":"An attempted operation did not succeed; a bounded reason must accompany it."},
    {"id":"not-visible","label":"Not visible","definition":"Traffic did not traverse an observable interface or remained inside an opaque tunnel."},
    {"id":"suspected","label":"Suspected","definition":"Evidence supports a classification but does not prove it."},
    {"id":"confirmed","label":"Confirmed","definition":"Evidence meets the documented acceptance bar for the claim."},
    {"id":"fallback-confirmed","label":"Fallback confirmed","definition":"After a block, the same device used the expected fallback path within the evidence window."},
    {"id":"no-fallback","label":"No fallback","definition":"No expected fallback was observed within the evidence window."},
    {"id":"still-encrypted","label":"Still encrypted","definition":"The flow continued over an encrypted path ShakerProxy did not decrypt."},
    {"id":"insufficient-evidence","label":"Insufficient evidence","definition":"The observation window ended without enough evidence to decide."},
    {"id":"applied","label":"Applied","definition":"The backend confirmed the exact requested revision is active; this is not a client outcome."},
    {"id":"pending","label":"Pending","definition":"A change is staged or running and has not reached a terminal state."},
    {"id":"rolled-back","label":"Rolled back","definition":"The change was reverted automatically or manually."},
    {"id":"downloaded","label":"Downloaded","definition":"A certificate or artifact was served; trust or successful use is not implied."},
    {"id":"trusted","label":"Trusted","definition":"A client demonstrated trust in a bounded tested context."},
    {"id":"interception-confirmed","label":"Interception confirmed","definition":"A test flow from the device was decrypted through the selected interception path."},
    {"id":"hold","label":"Hold","definition":"A retention override protects a case, capture, artifact, or legal scope from deletion."},
    {"id":"tombstone","label":"Tombstone","definition":"A deletion barrier prevents delayed ingestion from recreating removed data."},
    {"id":"partial","label":"Partial","definition":"A multi-backend operation ended without every backend confirming success."},
    {"id":"demo-data","label":"Demo data","definition":"Synthetic fixture data that is never represented as observed traffic."},
    {"id":"configuration-lock","label":"Configuration lock","definition":"The single cross-process lease that prevents first-party privileged appliance mutations from interleaving."},
    {"id":"management-ca","label":"Management CA","definition":"A local certificate authority used only to authenticate the ShakerProxy management HTTPS endpoint; it must never sign interception certificates."},
    {"id":"evidence-hold","label":"Evidence hold","definition":"A durable post-capture retention override whose active host sidecar blocks manual capture deletion and automatic capture retention until its owning case releases it."},
    {"id":"api-token","label":"API token","definition":"A display-once, expiring bearer credential whose persisted digest grants only enumerated public API scopes and optional exact resource restrictions."},
    {"id":"safe-event","label":"Safe event","definition":"A fixed outbound metadata projection with no field capable of carrying raw event bodies, packet payloads, key logs, CA material, or administrator credentials."},
    {"id":"last-known-good","label":"Last known good","definition":"The most recent prior signed content revision that passed structural validation and consumer health and can be selected without a network fetch."},
    {"id":"observe-only","label":"Observe only","definition":"Bounded metadata is recorded or displayed without changing routing, resolver policy, service ownership, or the client's outcome."},
    {"id":"local-dns-enforcement","label":"Local DNS enforcement","definition":"A confirmed client-side IPv4 interface redirects plain UDP/TCP port 53 to ShakerProxy's local forwarding resolver; this does not imply encrypted-DNS control or a per-query client outcome."},
    {"id":"working-wan","label":"Working WAN","definition":"The selected upstream interface or parent currently owns a kernel default route; its configuration is preserved unless a reviewed plan explicitly acknowledges the change."}
  ]
}

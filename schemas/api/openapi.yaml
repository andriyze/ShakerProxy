        footprint: {$ref: "#/components/schemas/CaptureDeletionFootprint"}
        state: {type: string, enum: [PENDING, DELETED, FAILED]}
        deletion_preview_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        deletion_preview_expires_at: {type: string, format: date-time}
        deletion_idempotency_key: {type: string, minLength: 16, maxLength: 128}
        deletion_job_id: {type: string, pattern: "^capture-delete-[a-f0-9]{32}$"}
        coordinated_deletion_job_id: {type: string, pattern: "^capture-delete-operation-[a-f0-9]{32}$"}
        failure: {type: string, maxLength: 256}
        updated_at: {type: string, format: date-time}
    CaptureRetentionRun:
      type: object
      additionalProperties: false
      required: [schema, id, state, phase, policy_revision, policy, preview_sha256, administrator, trigger, items, selected_sessions, deleted_sessions, failed_sessions, remaining_files, remaining_bytes, created_at, updated_at]
      properties:
        schema: {const: 1}
        id: {type: string, pattern: "^retention-run-[a-f0-9]{32}$"}
        state: {type: string, enum: [PENDING, RUNNING, COMPLETED, PARTIAL, FAILED]}
        phase: {type: string, maxLength: 64}
        policy_revision: {type: integer, minimum: 1, maximum: 1024}
        policy: {$ref: "#/components/schemas/CaptureRetentionPolicyInput"}
        preview_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        administrator: {type: string, minLength: 1, maxLength: 96}
        trigger: {type: string, enum: [MANUAL, AUTOMATIC]}
        scheduled_for: {type: string, format: date-time}
        items: {type: array, maxItems: 1024, items: {$ref: "#/components/schemas/CaptureRetentionRunItem"}}
        selected_sessions: {type: integer, minimum: 0, maximum: 1024}
        deleted_sessions: {type: integer, minimum: 0, maximum: 1024}
        failed_sessions: {type: integer, minimum: 0, maximum: 1024}
        remaining_files: {type: integer, minimum: 0}
        remaining_bytes: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
    CaptureRetentionSchedulerStatus:
      type: object
      additionalProperties: false
      required: [schema, enabled, policy_revision, checked_at]
      properties:
        schema: {const: 1}
        enabled: {type: boolean}
        policy_revision: {type: integer, minimum: 0, maximum: 1024}
        checked_at: {type: string, format: date-time}
        next_run_at: {type: string, format: date-time}
        last_run_id: {type: string, pattern: "^retention-run-[a-f0-9]{32}$"}
        last_run_state: {type: string, enum: [PENDING, RUNNING, COMPLETED, PARTIAL, FAILED]}
        last_run_at: {type: string, format: date-time}
        last_failure: {type: string, enum: [automatic retention check failed]}
        last_failure_at: {type: string, format: date-time}
    CaptureExportRecord:
      type: object
      additionalProperties: false
      required: [schema, id, session_id, file_name, sha256, username, range_start, range_end, bytes_sent, complete, exported_at]
      properties:
        schema: {const: 1}
        id: {type: string, pattern: "^export-[a-f0-9]{32}$"}
        session_id: {type: string, pattern: "^capture-[a-f0-9]{32}$"}
        file_name: {type: string, maxLength: 255}
        sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        username: {type: string, maxLength: 96}
        range_start: {type: integer, minimum: 0}
        range_end: {type: integer, minimum: 0}
        bytes_sent: {type: integer, minimum: 0}
        complete: {type: boolean}
        exported_at: {type: string, format: date-time}
    DeviceInventorySnapshot:
      type: object
      additionalProperties: false
      required: [schema, generated_at, evidence_as_of, devices]
      properties:
        schema: {const: 1}
        generated_at: {type: string, format: date-time}
        evidence_as_of: {type: string, format: date-time}
        devices: {type: array, maxItems: 50000, items: {$ref: "#/components/schemas/Device"}}
        address_aliases: {type: array, maxItems: 4096, items: {$ref: "#/components/schemas/AddressAlias"}}
        platform_hints:
          type: object
          description: "What each listed device most likely is, keyed by device ID, from the operating-system connectivity checks it made in the last 7 days (for example GrapheneOS phone from connectivitycheck.grapheneos.network), or from its DHCP request (source dhcp, for example Android device from android-dhcp-14). Derived on each request and never stored; best effort, so it is absent when the event store is slow or unavailable, and for API tokens without traffic:read."
          maxProperties: 50000
          additionalProperties:
            type: object
            additionalProperties: false
            required: [platform, last_seen]
            properties:
              platform: {type: string, maxLength: 64}
              domain: {type: string, maxLength: 253, description: "The connectivity check that identified the device; absent for a DHCP fingerprint."}
              last_seen: {type: string, format: date-time}
              source: {type: string, enum: [dhcp], description: "Present when the device's DHCP request identified it."}
              detail: {type: string, maxLength: 300, description: "The vendor class or option order that matched."}
        lab_routing:
          type: object
          description: "Keyed by device ID: whether each device seen on the lab recently sends its traffic through ShakerProxy (see GET /api/v1/lab-routing)."
          maxProperties: 512
          additionalProperties: {$ref: "#/components/schemas/LabRoutingDevice"}
    LabRoutingDevice:
      type: object
      additionalProperties: false
      required: [address, routing, since, last_seen, evidence]
      properties:
        address: {type: string, maxLength: 15}
        hardware_addrs: {type: array, maxItems: 8, items: {type: string, maxLength: 17}}
        host_name: {type: string, maxLength: 253, description: The name the device gave itself in DHCP.}
        routing: {type: string, enum: [THROUGH_SHAKERPROXY, BYPASSING, UNKNOWN], description: "UNKNOWN: seen for less than threshold_seconds, with no traffic through ShakerProxy yet."}
        since: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
        evidence: {type: array, maxItems: 8, items: {type: string, maxLength: 200}}
        reason: {type: string, maxLength: 300, description: "Why the traffic bypasses ShakerProxy, for BYPASSING."}
        device_id: {type: string, pattern: "^device-[a-f0-9]{32}$"}
        display_name: {type: string, maxLength: 253, description: "The administrator's name for the device, else the name it gave itself."}
    LabRoutingReport:
      type: object
      additionalProperties: false
      required: [schema, generated_at, available, threshold_seconds, counts, devices]
      properties:
        schema: {const: 1}
        generated_at: {type: string, format: date-time}
        available: {type: boolean}
        unavailable: {type: string, maxLength: 200}
        topology: {type: string, maxLength: 64}
        prefix: {type: string, maxLength: 18}
        subnet_mask: {type: string, maxLength: 15}
        shakerproxy_address: {type: string, maxLength: 15, description: The gateway and DNS server lab devices should use.}
        router_address: {type: string, maxLength: 15, description: "The network's own router on the lab, when the lab side has a default route through one."}
        threshold_seconds: {type: integer, minimum: 1}
        counts:
          type: object
          additionalProperties: false
          required: [through_shakerproxy, bypassing, unknown]
          properties:
            through_shakerproxy: {type: integer, minimum: 0}
            bypassing: {type: integer, minimum: 0}
            unknown: {type: integer, minimum: 0}
        devices: {type: array, maxItems: 512, items: {$ref: "#/components/schemas/LabRoutingDevice"}}
    AddressAlias:
      type: object
      additionalProperties: false
      required: [schema, id, revision, name, prefix, interface, valid_from, priority, confidence, reason, created_by, updated_by, created_at, updated_at]
      properties:
        schema: {const: 1}
        id: {type: string, pattern: "^address-alias-[a-f0-9]{32}$"}
        revision: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 128}
        prefix: {type: string, minLength: 3, maxLength: 64, description: Canonical IPv4 or IPv6 CIDR. Exact addresses use /32 or /128.}
        interface: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,14}$"}
        vlan_id: {type: integer, minimum: 1, maximum: 4094}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time, description: Exclusive end; omission means no scheduled end.}
        priority: {type: integer, minimum: 0, maximum: 1000}
        confidence: {type: integer, minimum: 1, maximum: 100}
        reason: {type: string, minLength: 1, maxLength: 256}
        created_by: {type: string, minLength: 1, maxLength: 96}
        updated_by: {type: string, minLength: 1, maxLength: 96}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        conflict: {type: boolean}
        conflict_warnings: {type: array, maxItems: 32, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 256}}
    AliasTagExport:
      type: object
      additionalProperties: false
      required: [schema, generated_at, entries]
      properties:
        schema: {const: 1}
        generated_at: {type: string, format: date-time}
        entries: {type: array, maxItems: 50000, items: {$ref: "#/components/schemas/AliasTagExportEntry"}}
    AliasTagExportEntry:
      type: object
      additionalProperties: false
      required: [device_id, friendly_name, alias_revision, tags]
      properties:
        device_id: {type: string, pattern: "^device-[a-f0-9]{32}$"}
        friendly_name: {type: string, maxLength: 128}
        alias_revision: {type: integer, minimum: 0}
        tags: {type: array, maxItems: 32, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 64}}
    AliasTagImportPreviewRequest:
      type: object
      additionalProperties: false
      required: [format, content, reason]
      properties:
        format: {type: string, enum: [json, csv]}
        content: {type: string, minLength: 1, maxLength: 1048576}
        reason: {type: string, minLength: 1, maxLength: 256}
    PreparedAliasTagImportEntry:
      type: object
      additionalProperties: false
      required: [device_id, friendly_name, alias_revision, tags, expected_tags_sha256]
      properties:
        device_id: {type: string, pattern: "^device-[a-f0-9]{32}$"}
        friendly_name: {type: string, maxLength: 128}
        alias_revision: {type: integer, minimum: 0}
        tags: {type: array, maxItems: 32, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 64}}
        expected_tags_sha256: {type: string, pattern: "^$|^[a-f0-9]{64}$", description: Empty only when DEVICE_NOT_FOUND blocks the preview.}
    AliasTagImportChange:
      type: object
      additionalProperties: false
      required: [device_id, current_friendly_name, proposed_friendly_name, current_tags, proposed_tags, name_changed, tags_changed, warnings]
      properties:
        device_id: {type: string, pattern: "^device-[a-f0-9]{32}$"}
        current_friendly_name: {type: string, maxLength: 128}
        proposed_friendly_name: {type: string, maxLength: 128}
        current_tags: {type: array, maxItems: 32, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 64}}
        proposed_tags: {type: array, maxItems: 32, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 64}}
        name_changed: {type: boolean}
        tags_changed: {type: boolean}
        warnings: {type: array, maxItems: 4, items: {type: string, minLength: 1, maxLength: 256}}
    AliasTagImportBlocker:
      type: object
      additionalProperties: false
      required: [device_id, code, message]
      properties:
        device_id: {type: string, pattern: "^device-[a-f0-9]{32}$"}
        code: {type: string, enum: [DEVICE_NOT_FOUND, ALIAS_REVISION_STALE]}
        message: {type: string, minLength: 1, maxLength: 256}
    AliasTagImportPreview:
      type: object
      additionalProperties: false
      required: [schema, preview_sha256, generated_at, expires_at, reason, entries, changes, blockers, ready]
      properties:
        schema: {const: 1}
        preview_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        generated_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        reason: {type: string, minLength: 1, maxLength: 256}
        entries: {type: array, minItems: 1, maxItems: 256, items: {$ref: "#/components/schemas/PreparedAliasTagImportEntry"}}
        changes: {type: array, maxItems: 256, items: {$ref: "#/components/schemas/AliasTagImportChange"}}
        blockers: {type: array, maxItems: 256, items: {$ref: "#/components/schemas/AliasTagImportBlocker"}}
        ready: {type: boolean}
    AliasTagImportApplyRequest:
      type: object
      additionalProperties: false
      required: [password, preview]
      properties:
        password: {type: string, minLength: 1, maxLength: 1024}
        preview: {$ref: "#/components/schemas/AliasTagImportPreview"}
    AliasTagImportResult:
      type: object
      additionalProperties: false
      required: [schema, updated_devices, audit, replayed]
      properties:
        schema: {const: 1}
        updated_devices: {type: integer, minimum: 1, maximum: 256}
        audit: {type: object}
        replayed: {type: boolean}
    AddressAliasResolution:
      type: object
      additionalProperties: false
      required: [schema, address, interface, occurred_at, matched, conflict]
      properties:
        schema: {const: 1}
        address: {type: string, maxLength: 64}
        interface: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,14}$"}
        vlan_id: {type: integer, minimum: 1, maximum: 4094}
        occurred_at: {type: string, format: date-time}
        matched: {type: boolean}
        conflict: {type: boolean}
        alias: {$ref: "#/components/schemas/AddressAlias"}
        candidates: {type: array, maxItems: 4096, items: {$ref: "#/components/schemas/AddressAlias"}}
    CATrust:
      type: string
      enum: [UNKNOWN, INSTALLED, NOT_INSTALLED]
    CATrustResult:
      type: object
      additionalProperties: false
      required: [schema, device_id, ca_trust, updated_at]
      properties:
        schema: {const: 1}
        device_id: {type: string, pattern: "^device-[a-f0-9]{32}$"}
        ca_trust: {$ref: "#/components/schemas/CATrust"}
        updated_at: {type: string, format: date-time}
    ObservedDHCPIdentity:
      type: object
      additionalProperties: false
      description: "The newest DHCP identity the device showed on the lab when another server (the network's router, in a single-arm lab or an inline bridge) answered it, from the exchanges the lab recording saw."
      required: [hardware_addr, last_seen]
      properties:
        hardware_addr: {type: string, pattern: "^[0-9a-f]{2}(:[0-9a-f]{2}){5}$"}
        host_name: {type: string, maxLength: 253, description: "The name the client gave itself (option 12), as it sent it."}
        client_fqdn: {type: string, maxLength: 253, description: "Option 81."}
        vendor_class: {type: string, maxLength: 255, description: "Option 60, for example android-dhcp-14 or MSFT 5.0."}
        parameter_list: {type: string, maxLength: 255, pattern: "^[0-9]{1,3}(,[0-9]{1,3}){0,63}$", description: "Option 55 in the client's order, a fingerprint of its DHCP implementation."}
        server: {type: string, format: ipv4, description: "The DHCP server that acknowledged the lease."}
        router: {type: string, format: ipv4, description: "The default gateway the server handed out (option 3)."}
        last_seen: {type: string, format: date-time}
    DeviceMatch:
      type: object
      additionalProperties: false
      required: [device_id, friendly_name, vendor, addresses, hardware_addresses, online, match]
      properties:
        device_id: {type: string, pattern: "^device-[a-f0-9]{32}$"}
        friendly_name: {type: string, description: Friendly name, or the best available name when none is set.}
        vendor: {type: string}
        addresses: {type: array, items: {type: string}, description: Current addresses, or the most recent one when the device is offline.}
        hardware_addresses: {type: array, items: {type: string}}
        online: {type: boolean}
        match: {type: string, enum: [id, mac, ip, name, name_prefix, name_contains]}
        dhcp_host_name: {type: string, maxLength: 253, description: "The name the device gave another DHCP server on the lab."}
        dhcp_vendor_class: {type: string, maxLength: 255}
        dhcp_platform: {type: string, maxLength: 64, description: "What the DHCP request says the device is, for example Android device."}
    DeviceResolution:
      type: object
      additionalProperties: false
      required: [schema, query, unique, matches]
      properties:
        schema: {const: 1}
        query: {type: string}
        unique: {type: boolean}
        matches: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/DeviceMatch"}}
    ReportFinding:
      type: object
      additionalProperties: false
      required: [id, severity, title, detail, recommendation, evidence]
      properties:
        id: {type: string, enum: [accepts-untrusted-certificates, cleartext-http, insecure-remote-access, outdated-tls, encrypted-dns-bypass, vpn-or-tunnel, opaque-traffic, certificate-pinning, exotic-protocols, alerts]}
        severity: {type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW, INFO]}
        title: {type: string}
        detail: {type: string}
        recommendation: {type: string}
        evidence: {type: array, maxItems: 11, items: {type: string}}
    ReportTotals:
      type: object
      additionalProperties: false
      required: [events, flows, bytes, dns_queries, tls_connections, http_requests, alerts]
      properties:
        events: {type: integer, minimum: 0}
        flows: {type: integer, minimum: 0}
        bytes: {type: integer, minimum: 0}
        dns_queries: {type: integer, minimum: 0}
        tls_connections: {type: integer, minimum: 0}
        http_requests: {type: integer, minimum: 0}
        alerts: {type: integer, minimum: 0}
    DeviceReport:
      type: object
      additionalProperties: false
      required: [schema, generated_at, device, window_start, window_end, session, ca_trust, summary, totals, domains, protocols, tls, http, findings, truncated]
      properties:
        schema: {const: 1}
        generated_at: {type: string, format: date-time}
        device:
          type: object
          additionalProperties: false
          required: [device_id, friendly_name, vendor, category, addresses, hardware_addresses, online]
          properties:
            device_id: {type: string, pattern: "^device-[a-f0-9]{32}$"}
            friendly_name: {type: string}
            vendor: {type: string}
            category: {type: string}
            addresses: {type: array, items: {type: string}}
            hardware_addresses: {type: array, items: {type: string}}
            online: {type: boolean}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        session: {oneOf: [{$ref: "#/components/schemas/TestSession"}, {type: "null"}]}
        ca_trust: {$ref: "#/components/schemas/CATrust"}
        summary: {type: string, description: One plain-language sentence summarizing the report.}
        totals: {$ref: "#/components/schemas/ReportTotals"}
        domains:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [domain, registrable_domain, organization, category, sources, events, first_seen, last_seen]
            properties:
              domain: {type: string}
              registrable_domain: {type: string}
              organization: {type: string}
              category: {type: string, enum: [analytics, advertising, crash-reporting, telemetry, cloud-platform, cdn, push, os-services, streaming, iot-cloud, unknown]}
              sources: {type: array, items: {type: string, enum: [dns, tls, http]}}
              events: {type: integer, minimum: 1}
              first_seen: {type: string, format: date-time}
              last_seen: {type: string, format: date-time}
        protocols:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [protocol, label, category, visibility, evidence, exotic, flows, bytes]
            properties:
              protocol: {type: string}
              label: {type: string}
              category: {type: string}
              visibility: {type: string, enum: [DECRYPTED, CLEARTEXT, ENCRYPTED_METADATA, OPAQUE]}
              evidence: {type: string, enum: [ANALYZER, PORT_HEURISTIC, UNCLASSIFIED]}
              exotic: {type: boolean}
              flows: {type: integer, minimum: 0}
              bytes: {type: integer, minimum: 0}
        tls:
          type: object
          additionalProperties: false
          required: [intercepted, bypassed, failed, pinning_suspected, failed_hosts, intercepted_hosts, old_versions]
          properties:
            intercepted: {type: integer, minimum: 0}
            bypassed: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            pinning_suspected: {type: integer, minimum: 0}
            failed_hosts: {type: array, maxItems: 50, items: {type: string}}
            intercepted_hosts: {type: array, maxItems: 50, items: {type: string}}
            old_versions:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [version, hosts]
                properties:
                  version: {type: string, enum: [SSLv2, SSLv3, TLSv1.0, TLSv1.1, DTLSv1.0]}
                  hosts: {type: array, maxItems: 20, items: {type: string}}
        http:
          type: object
          additionalProperties: false
          required: [requests, hosts, cleartext_requests, status_classes]
          properties:
            requests: {type: integer, minimum: 0}
            hosts: {type: integer, minimum: 0}
            cleartext_requests: {type: integer, minimum: 0}
            status_classes:
              type: object
              additionalProperties: false
              required: ["2xx", "3xx", "4xx", "5xx"]
              properties:
                "2xx": {type: integer, minimum: 0}
                "3xx": {type: integer, minimum: 0}
                "4xx": {type: integer, minimum: 0}
                "5xx": {type: integer, minimum: 0}
        findings: {type: array, maxItems: 10, items: {$ref: "#/components/schemas/ReportFinding"}}
        truncated: {type: boolean}
    DeviceComparison:
      type: object
      additionalProperties: false
      required: [schema, generated_at, device_id, summary, base, compare, domains, protocols, findings, tls, truncated]
      properties:
        schema: {const: 1}
        generated_at: {type: string, format: date-time}
        device_id: {type: string, pattern: "^device-[a-f0-9]{32}$"}
        summary: {type: string}
        base: {$ref: "#/components/schemas/ComparisonSide"}
        compare: {$ref: "#/components/schemas/ComparisonSide"}
        domains: {$ref: "#/components/schemas/ComparisonChange"}
        protocols: {$ref: "#/components/schemas/ComparisonChange"}
        findings:
          type: object
          additionalProperties: false
          required: [new, resolved]
          properties:
            new: {type: array, items: {$ref: "#/components/schemas/ReportFinding"}}
            resolved: {type: array, items: {$ref: "#/components/schemas/ReportFinding"}}
        tls:
          type: object
          additionalProperties: false
          required: [newly_failed_hosts, newly_intercepted_hosts]
          properties:
            newly_failed_hosts: {type: array, maxItems: 200, items: {type: string}}
            newly_intercepted_hosts: {type: array, maxItems: 200, items: {type: string}}
        truncated: {type: boolean, description: True when either run reached a list bound, so some added or removed items may only reflect ranking.}
    ComparisonSide:
      type: object
      additionalProperties: false
      required: [start, end, totals]
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        session_id: {type: string, pattern: "^ts-[a-f0-9]{24}$"}
        name: {type: string}
        totals: {$ref: "#/components/schemas/ReportTotals"}
    ComparisonChange:
      type: object
      additionalProperties: false
      required: [added, removed]
      properties:
        added: {type: array, maxItems: 200, items: {type: string}}
        removed: {type: array, maxItems: 200, items: {type: string}}
    TestSession:
      type: object
      additionalProperties: false
      required: [schema, id, device_id, device_name, name, notes, state, started_at, ended_at, capture_session_id, created_by]
      properties:
        schema: {const: 1}
        id: {type: string, pattern: "^ts-[a-f0-9]{24}$"}
        device_id: {type: string, pattern: "^device-[a-f0-9]{32}$"}
        device_name: {type: string, maxLength: 256}
        name: {type: string, minLength: 1, maxLength: 120}
        notes: {type: string, maxLength: 4096}
        state: {type: string, enum: [RUNNING, STOPPED]}
        started_at: {type: string, format: date-time}
        ended_at: {type: [string, "null"], format: date-time}
        capture_session_id: {type: [string, "null"], pattern: "^capture-[a-f0-9]{32}$"}
        created_by: {type: string, maxLength: 96}
    TestSessionResult:
      allOf:
        - {$ref: "#/components/schemas/TestSession"}

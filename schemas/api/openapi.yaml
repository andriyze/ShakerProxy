        index_invalidation_state: {type: string, enum: [NOT_REQUIRED, PENDING]}
        secure_erasure_guaranteed: {const: false}
        failure: {type: string, pattern: "^[A-Z0-9_]{1,64}$"}
        started_at: {type: string, format: date-time}

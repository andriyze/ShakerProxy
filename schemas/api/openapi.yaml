openapi: 3.1.0
info:
  title: ShakerProxy Control API
  version: 0.1.0-dev
  description: |
    Setup-safe API. Only operations implemented by this build are listed.

    Discover resources with GET /api/v1 and fetch this document from GET /api/v1/openapi.yaml.
    Every error, including unknown routes (404 not_found) and unsupported methods
    (405 method_not_allowed with an Allow header), uses the JSON shape
    {"error":{"code":"snake_case","message":"What went wrong and what to do next."}}.
    Request bodies are JSON (Content-Type application/json, optional charset=utf-8);
    decoding errors name the offending field.

    Authentication: sign in with POST /auth/login and send Authorization: Bearer <session_token>.
    Sessions slide (1 hour idle, 12 hours maximum); authenticated responses carry
    X-ShakerProxy-Session-Expires-At. Scoped API tokens (POST /auth/tokens) use the same header.

    Password confirmation: fields named "password" confirm the administrator. After any
    successful password check (including sign-in) the same session may omit "password" for
    10 minutes on routes marked "recent confirmation"; they answer 401 reauthentication_required
    when a password is needed. Routes marked "password every time" (network commit/confirm,
    deletion execution and retention, API token creation, enabling HTTPS decryption for every
    client, enabling decrypted HTTP body retention) answer 401 password_required without one.
servers:
  - url: /api/v1
paths:
  /setup/status:
    get:
      operationId: getSetupStatus
      responses:
        "200": {description: Setup state, content: {application/json: {schema: {$ref: "#/components/schemas/SetupStatus"}}}}
  /setup/complete:
    post:
      operationId: completeSetup
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SetupRequest"}}}}
      responses:
        "201": {description: Administrator created and token consumed; the response carries a session (see SessionResponse), recovery_codes and a warning to store them}
        "400": {$ref: "#/components/responses/Error"}
  /:
    get:
      operationId: getAPIIndex
      description: Unauthenticated index of the main resources with one-line descriptions.
      responses:
        "200": {description: Resource index, content: {application/json: {schema: {$ref: "#/components/schemas/APIIndex"}}}}
  /openapi.yaml:
    get:
      operationId: getOpenAPIDocument
      description: This OpenAPI document as packaged with the appliance.
      responses:
        "200": {description: OpenAPI 3.1 document, content: {application/yaml: {schema: {type: string}}}}
        "503": {$ref: "#/components/responses/Error"}
  /auth/login:
    post:
      operationId: login
      description: Signs in the administrator. The session slides with use (1 hour idle, 12 hours maximum) and counts as a recent password confirmation for 10 minutes. Ten failed password attempts within five minutes answer 429 with Retry-After.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/LoginRequest"}}}}
      responses:
        "200": {description: Session token and expiry, content: {application/json: {schema: {$ref: "#/components/schemas/SessionResponse"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /auth/logout:
    post:
      operationId: logout
      description: Ends the session named by the bearer token. Idempotent; logged_out is false when the session was already gone.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Session revoked, content: {application/json: {schema: {type: object, additionalProperties: false, required: [schema, logged_out], properties: {schema: {const: 1}, logged_out: {type: boolean}}}}}}
        "401": {$ref: "#/components/responses/Error"}
  /auth/recover:
    post:
      operationId: recoverAdministrator
      description: Sets a new administrator password with one of the single-use recovery codes shown at setup (case, spaces and dashes are ignored). The new password must meet the setup password policy; a rejected password does not consume the code. All existing sessions are revoked and a new session is returned. Rate limited like sign-in.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RecoverRequest"}}}}
      responses:
        "200": {description: New session and remaining code count, content: {application/json: {schema: {$ref: "#/components/schemas/RecoverResponse"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /auth/tokens:
    get:
      operationId: listAPITokens
      description: Session-only listing of hash-only, expiring API token metadata. Cleartext credentials and stored digests are never returned.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Token metadata and supported scopes, content: {application/json: {schema: {type: object, additionalProperties: false, required: [tokens, allowed_scopes, maximum_lifetime_seconds], properties: {tokens: {type: array, maxItems: 1024, items: {$ref: "#/components/schemas/APIToken"}}, allowed_scopes: {type: array, items: {$ref: "#/components/schemas/APITokenScope"}}, sensitive_scopes: {type: array, items: {$ref: "#/components/schemas/APITokenScope"}}, maximum_lifetime_seconds: {const: 7776000}}}}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      operationId: createAPIToken
      description: Session-only, freshly reauthenticated creation. The cleartext credential is returned exactly once and only its SHA-256 digest is persisted.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateAPITokenRequest"}}}}
      responses:
        "201": {description: Display-once credential and public metadata, headers: {X-ShakerProxy-Secret-Handling: {schema: {const: display-once}}}, content: {application/json: {schema: {$ref: "#/components/schemas/CreatedAPIToken"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /auth/tokens/{tokenID}:
    delete:
      operationId: revokeAPIToken
      description: Session-only, freshly reauthenticated and idempotent credential revocation.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/APITokenID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RevokeAPITokenRequest"}}}}
      responses:
        "200": {description: Revoked token metadata}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /integrations/forwarders:
    get:
      operationId: listForwarders
      description: Session-only status for bounded payload-free JSONL, HTTPS webhook, and syslog-over-TLS integrations. HMAC secrets are never returned after creation.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Forwarder status, queue lag/drop evidence, transport catalog, and immutable payload policy}
        "401": {$ref: "#/components/responses/Error"}
    post:
      operationId: createForwarder
      description: Creates a freshly reauthenticated integration in the disabled state. Webhook HMAC material is returned once. Local JSONL uses an appliance-owned bounded path; external transports reject non-public destinations and redirects.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateForwarderRequest"}}}}
      responses:
        "201": {description: Disabled integration and optional display-once HMAC secret, content: {application/json: {schema: {$ref: "#/components/schemas/CreatedForwarder"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /integrations/forwarders/{forwarderID}:
    patch:
      operationId: updateForwarder
      description: Recent confirmation. Changes the name, destination or event classes of a forwarder; kind and webhook secret are unchanged. expected_revision is optional (0 skips the check). A request matching the stored values returns the forwarder unchanged.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/ForwarderID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpdateForwarderRequest"}}}}
      responses:
        "200": {description: Updated public integration metadata, content: {application/json: {schema: {$ref: "#/components/schemas/ForwarderIntegration"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteForwarder
      description: Recent confirmation. Deletes a forwarder and its pending delivery queue. A local JSONL forwarder's output file is kept. The body is optional.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/ForwarderID"}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: "#/components/schemas/DeleteForwarderRequest"}}}}
      responses:
        "200": {description: Deleted forwarder, content: {application/json: {schema: {type: object, additionalProperties: false, required: [schema, deleted, forwarder], properties: {schema: {const: 1}, deleted: {const: true}, forwarder: {$ref: "#/components/schemas/ForwarderIntegration"}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /integrations/forwarders/{forwarderID}/enabled:
    put:
      operationId: setForwarderEnabled
      description: Freshly reauthenticated optimistic enable or disable. New forwarders cannot deliver until this separate audited action succeeds.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/ForwarderID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SetForwarderEnabledRequest"}}}}
      responses:
        "200": {description: Updated public integration metadata, content: {application/json: {schema: {$ref: "#/components/schemas/ForwarderIntegration"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /integrations/syslog-collector:
    get:
      operationId: getSyslogCollector
      description: "Session-only configuration and status of the network-gear (UniFi) log collector, which turns the lab router's own syslog into events and device identity. Off by default; status is counts and per-source liveness only, never log content."
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Collector configuration and status, content: {application/json: {schema: {$ref: "#/components/schemas/SyslogCollector"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    put:
      operationId: putSyslogCollector
      description: "Freshly reauthenticated optimistic update of the collector configuration. Enabling requires a transport and at least one allowed source (the router's IP), so it never accepts logs from everywhere. The service picks the change up and starts or stops its listener."
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PutSyslogCollectorRequest"}}}}
      responses:
        "200": {description: Updated collector configuration and status, content: {application/json: {schema: {$ref: "#/components/schemas/SyslogCollector"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /metrics:
    get:
      operationId: getOpenMetrics
      description: OpenMetrics 1.0 status counters. This endpoint rejects browser sessions and requires a dedicated metrics:read API token. Labels are bounded and contain no device, destination, body, credential, or CA data.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Bounded OpenMetrics text, content: {application/openmetrics-text: {schema: {type: string, maxLength: 131072}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /system/status:
    get:
      operationId: getSystemStatus
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Managed host state}
        "401": {$ref: "#/components/responses/Error"}
  /coverage:
    get:
      operationId: getVisibilityCoverage
      description: The last visibility coverage check and a fresh inspection of every way devices could bypass ShakerProxy in the current lab (IPv6 from another router, another DHCP server, device-to-device traffic, encrypted DNS, plain DNS to other resolvers, local discovery). Each check result says whether the traffic type was recorded, as which event kinds, how long it took to appear, and what is missing. API tokens need system:read.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Coverage overview
          content:
            application/json:
              schema:
                type: object
                required: [schema, last_run, routing, gap_count, checked_at]
                properties:
                  schema: {const: 1}
                  last_run: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/CoverageReport"}]}
                  routing: {type: array, maxItems: 32, items: {$ref: "#/components/schemas/CoverageFinding"}}
                  gap_count: {type: integer, minimum: 0}
                  checked_at: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /coverage/runs:
    post:
      operationId: startVisibilityCoverageRun
      description: Recent confirmation (administrator session only). Starts the visibility coverage check in the background. The virtual test lab sends one of each traffic type (DNS via ShakerProxy and to another resolver, DoT, DoH, DoQ, HTTP, HTTPS, QUIC, TCP and UDP on unusual ports, ICMP, SSH, NTP, mDNS, SSDP) while gatewayd records the test-lab bridge with a normal capture; the real analyzers and DNS forwarder store the events, which the check reads back. Lab recording pauses for a few seconds. Poll GET /coverage for progress; one run at a time.
      security: [{bearerAuth: []}]
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {password: {type: string, maxLength: 1024}}}}}}
      responses:
        "202": {description: Run started, content: {application/json: {schema: {$ref: "#/components/schemas/CoverageReport"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /system/diagnostics:
    get:
      operationId: getSystemDiagnostics
      description: Returns a bounded read-only appliance report for interfaces, routes, DNS, DHCP, forwarding, firewall, Docker service state, managed services, CPU/memory/disk pressure, clock synchronization, capture state, and packet drops. Unknown evidence is reported explicitly.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Bounded appliance diagnostic report, content: {application/json: {schema: {$ref: "#/components/schemas/DiagnosticReport"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /recovery-objectives:
    get:
      operationId: getRecoveryObjectives
      description: Returns machine-validated verified, target, and explicitly not-offered RTO/RPO contracts. A target is never presented as verified.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Bounded recovery objective registry, content: {application/json: {schema: {$ref: "#/components/schemas/RecoveryObjectiveRegistry"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /system/ports:
    get:
      operationId: getServicePortPlan
      description: Read-only ownership plan for TCP/UDP 53, 443, 853, and management TCP/8443. A loopback-only systemd-resolved stub is preserved and is not treated as a wildcard conflict. This endpoint never changes a listener or enables DNS.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Fixed service-port ownership inventory, content: {application/json: {schema: {$ref: "#/components/schemas/ServicePortPlan"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /system/connectivity-probe:
    post:
      operationId: probeConnectivity
      description: Session-only, explicitly initiated and rate-limited fixed-destination probes. HTTPS is dialed at 1.1.1.1 with verified TLS for one.one.one.one, so its result does not depend on DNS. TCP/53 tests only reachability and never sends a DNS query.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false}}}}
      responses:
        "200": {description: DNS-independent connectivity comparison, content: {application/json: {schema: {$ref: "#/components/schemas/ConnectivityReport"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /test-sessions:
    get:
      operationId: listTestSessions
      description: Newest-first test sessions. Requires an administrator session or devices:read.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: device, schema: {type: string, maxLength: 128}, description: Any device reference.}
        - {in: query, name: state, schema: {type: string, enum: [RUNNING, STOPPED]}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        "200": {description: Test sessions, content: {application/json: {schema: {$ref: "#/components/schemas/TestSessionList"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    post:
      operationId: startTestSession
      description: Starts a named test run against one device. The default name is "<device name> — YYYY-MM-DD HH:MM" (UTC). Starting a session stops the device's previous running session. capture true also starts a bounded header-only packet capture through the normal capture path; when capture is unavailable the session still starts and warnings explain why. Requires an administrator session or lab:write; no password prompt.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [device], properties: {device: {type: string, minLength: 1, maxLength: 128}, name: {type: string, maxLength: 120}, notes: {type: string, maxLength: 4096}, capture: {type: boolean, default: false}, full_capture: {type: boolean, default: false, description: "Record whole packets (implies capture) so TLS server names and certificates are analyzed."}}}}}}
      responses:
        "201": {description: Started test session, content: {application/json: {schema: {$ref: "#/components/schemas/TestSessionResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /test-sessions/{sessionID}:
    get:
      operationId: getTestSession
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/TestSessionID"}]
      responses:
        "200": {description: Test session, content: {application/json: {schema: {$ref: "#/components/schemas/TestSession"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateTestSession
      description: Renames a session or replaces its notes. Requires an administrator session or lab:write.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/TestSessionID"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, minProperties: 1, properties: {name: {type: string, minLength: 1, maxLength: 120}, notes: {type: string, maxLength: 4096}}}}}}
      responses:
        "200": {description: Updated test session, content: {application/json: {schema: {$ref: "#/components/schemas/TestSession"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteTestSession
      description: Deletes session metadata only; captured traffic and packet files are kept. Deleting a running session stops its linked capture. Requires an administrator session or lab:write.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/TestSessionID"}]
      responses:
        "200": {description: Deleted, content: {application/json: {schema: {type: object, additionalProperties: false, required: [schema, id, deleted], properties: {schema: {const: 1}, id: {type: string}, deleted: {const: true}, warnings: {type: array, items: {type: string}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /test-sessions/{sessionID}/stop:
    post:
      operationId: stopTestSession
      description: Stops a running session and its linked capture. Stopping a stopped session returns it unchanged. Requires an administrator session or lab:write.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/TestSessionID"}]
      responses:
        "200": {description: Stopped test session, content: {application/json: {schema: {$ref: "#/components/schemas/TestSessionResult"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /dns-visibility:
    get:
      operationId: getDNSVisibility
      description: The two DNS visibility switches of the lab; force_plain_dns is on and block_encrypted_dns off by default (encrypted DNS is identified as DoH, DoT or DoQ but not blocked). force_plain_dns answers every lab client's plain DNS (port 53, to any resolver) in ShakerProxy; block_encrypted_dns refuses DNS over TLS/QUIC (port 853) and the listed DNS-over-HTTPS resolvers by address, and answers their names and the encrypted-DNS canaries with NXDOMAIN, so devices fall back to plain DNS. Blocked attempts appear in Traffic as shakerproxy.blocked events.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Current switches, blocked resolvers and names, content: {application/json: {schema: {$ref: "#/components/schemas/DNSVisibility"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    put:
      operationId: setDNSVisibility
      description: Turns either switch on or off (an administrator session or an API token with lab:write). It applies a new traffic-policy revision through the privileged gateway; other policy settings are kept.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, minProperties: 1, properties: {force_plain_dns: {type: boolean}, block_encrypted_dns: {type: boolean}}}}}}
      responses:
        "200": {description: Switches after the change, content: {application/json: {schema: {$ref: "#/components/schemas/DNSVisibility"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /vpn:
    get:
      operationId: getVPN
      description: VPN mode (WireGuard). A phone or laptop on any network scans a QR code in the WireGuard app and sends all of its traffic, IPv4, IPv6 and local-network destinations, through ShakerProxy, where it appears in Traffic under the device's name. Off by default; nothing listens until it is turned on. Lists the VPN devices with their addresses, last handshake and byte counters; never a private key. An administrator session or an API token with system:read.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: VPN settings, devices and notes, content: {application/json: {schema: {$ref: "#/components/schemas/VPNStatus"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    put:
      operationId: setVPN
      description: Recent confirmation. Turns VPN mode on or off and changes its settings; fields left out keep their value. The change is applied transactionally by the privileged gateway; when it cannot be applied the previous VPN keeps running (or none) and the answer is 409 with the reason. endpoint is what device configurations dial (host or host:port, empty for this host's address); to use the VPN from outside, forward the UDP port on your router to the appliance and set endpoint to your public address or name. The VPN network cannot change while devices use it.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                password: {type: string, maxLength: 1024}
                expected_revision: {type: integer, minimum: 0}
                enabled: {type: boolean}
                listen_port: {type: integer, minimum: 1, maximum: 65535, default: 51820}
                endpoint: {type: string, maxLength: 260}
                ipv4_cidr: {type: string, default: 10.89.0.0/24}
                allow_peer_to_peer: {type: boolean, default: false, description: Let VPN devices reach each other.}
      responses:
        "200": {description: VPN after the change, content: {application/json: {schema: {$ref: "#/components/schemas/VPNStatus"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /vpn/devices:
    post:
      operationId: addVPNDevice
      description: Recent confirmation. Adds a VPN device and returns its WireGuard configuration once (config, also the QR payload the WireGuard apps scan, and file_name for a download). The configuration holds the device's private key, which ShakerProxy does not keep; add the device again if it is lost. The device's VPN address is named "<name> (VPN)" in Devices, so its traffic shows under that name at once. VPN mode must be on.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 64}, password: {type: string, maxLength: 1024}}}}}}
      responses:
        "201": {description: The new device and its one-time configuration, headers: {Cache-Control: {schema: {const: no-store}}}, content: {application/json: {schema: {$ref: "#/components/schemas/VPNDeviceConfig"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /vpn/devices/{peerID}:
    delete:
      operationId: revokeVPNDevice
      description: Recent confirmation. Revokes a VPN device; it is disconnected at once and cannot reconnect. Its entry in Devices keeps its name and recorded traffic.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: peerID, required: true, schema: {type: string, pattern: "^vpn-[a-f0-9]{16}$"}}
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {password: {type: string, maxLength: 1024}}}}}}
      responses:
        "200": {description: The revoked device, content: {application/json: {schema: {$ref: "#/components/schemas/VPNDevice"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /wifi-visibility:
    get:
      operationId: getWiFiVisibility
      description: "Wi-Fi visibility: whether a passive monitor interface records lab devices' 802.11 management frames (which networks they search for, when they authenticate, join, roam and leave), which adapters can listen and why not. Off by default; it never transmits."
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Settings, adapters and what runs, content: {application/json: {schema: {$ref: "#/components/schemas/WiFiVisibility"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    put:
      operationId: setWiFiVisibility
      description: "Turns Wi-Fi visibility on or off and chooses the adapter and channel (an administrator session or an API token with lab:write). Recording nearby devices and networks, which are not part of the lab, needs acknowledge_nearby; that data is deleted after 24 hours. A start that fails leaves monitoring off and the host unchanged."
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                enabled: {type: boolean}
                adapter: {type: string, maxLength: 15, description: Wi-Fi interface to listen with; empty chooses one.}
                channel_mode: {type: string, enum: [auto, fixed, hop], description: "auto listens on the lab access point's channel when ShakerProxy runs one, else hops."}
                channel: {type: integer, minimum: 0, maximum: 177, description: 2.4 or 5 GHz channel; implies fixed.}
                nearby: {type: boolean}
                acknowledge_nearby: {type: boolean}
      responses:
        "200": {description: Settings after the change, content: {application/json: {schema: {$ref: "#/components/schemas/WiFiVisibility"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /traffic-policy:
    get:
      operationId: getTrafficPolicy
      description: Session-only current DNS and TLS traffic-policy document from the privileged host. The installed production gateway profile is required.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Current revisioned traffic policy, content: {application/json: {schema: {$ref: "#/components/schemas/TrafficPolicyDocument"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    put:
      operationId: applyTrafficPolicy
      description: Freshly reauthenticated optimistic apply through the privileged gateway. Active controls require a confirmed IPv4 routed or single-arm plan, and listener failure leaves the packet path fail-open.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ApplyTrafficPolicyRequest"}}}}
      responses:
        "200": {description: Applied revisioned traffic policy, content: {application/json: {schema: {$ref: "#/components/schemas/TrafficPolicyDocument"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /traffic-policy/bypass:
    post:
      operationId: addTLSBypass
      description: One-click "bypass this host" for a TLS failure. With device (ID, MAC, IP or name) the host passes through undecrypted for that device only; without it, for every device. Session or lab:write token; no password. Applied through the revisioned, audited traffic-policy path.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TLSBypassRequest"}}}}
      responses:
        "200": {description: Bypass in effect from the next connection, content: {application/json: {schema: {$ref: "#/components/schemas/TLSBypassResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    delete:
      operationId: removeTLSBypass
      description: Removes a host bypass added with POST, for one device or for every device. Session or lab:write token.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: host, required: true, schema: {type: string, maxLength: 253}}
        - {in: query, name: device, schema: {type: string, maxLength: 256}, description: Device ID, MAC, IP or friendly name; omit for the every-device bypass.}
      responses:
        "200": {description: Bypass removed, content: {application/json: {schema: {$ref: "#/components/schemas/TLSBypassResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /traffic-policy/catalog:
    get:
      operationId: getTrafficResolverCatalog
      description: Session-only bounded catalog used to classify known encrypted-DNS resolver endpoints.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Built-in resolver catalog, content: {application/json: {schema: {$ref: "#/components/schemas/ResolverCatalog"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /traffic-policy/preview:
    post:
      operationId: previewTrafficPolicy
      description: Validates and renders a proposed policy against the confirmed client interface without mutating host state.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TrafficPolicy"}}}}
      responses:
        "200": {description: Policy digest, fixed firewall projection, changed objects, and limitations, content: {application/json: {schema: {$ref: "#/components/schemas/TrafficPolicyPreview"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /traffic-policy/rollback:
    post:
      operationId: rollbackTrafficPolicy
      description: Freshly reauthenticated optimistic rollback to the one retained previous policy. Rollback creates a new revision and preserves audit history.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RollbackTrafficPolicyRequest"}}}}
      responses:
        "200": {description: Newly revisioned rollback result, content: {application/json: {schema: {$ref: "#/components/schemas/TrafficPolicyDocument"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /interception-ca:
    get:
      operationId: getInterceptionCA
      description: Returns public metadata for the separate local TLS interception authority. Private key material is never exposed.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Public interception CA status and download locations, content: {application/json: {schema: {$ref: "#/components/schemas/InterceptionCAResponse"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /interception-ca/download:
    get:
      operationId: downloadInterceptionCA
      description: Downloads only the public interception CA in PEM or DER form for authorized test-device trust enrollment.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: format, schema: {type: string, enum: [pem, der], default: pem}}
      responses:
        "200": {description: Public interception CA certificate}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /interception-ca/onboarding:
    get:
      operationId: getInterceptionCAOnboarding
      description: Where lab devices get the interception CA (http://<lab gateway>/, served only while HTTPS decryption is configured) and per-platform install steps and limitations. When the page is not reachable, available is false and reason says what to do next. Session or system:read token.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Onboarding status, content: {application/json: {schema: {$ref: "#/components/schemas/InterceptionCAOnboarding"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /system/management-pki:
    get:
      operationId: getManagementPKI
      description: Returns the management-only local authority fingerprint and validity evidence. This authority is never the interception authority.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Management PKI metadata, content: {application/json: {schema: {$ref: "#/components/schemas/ManagementPKIStatus"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /system/management-ca.pem:
    get:
      operationId: downloadManagementCA
      description: Downloads only the public management CA certificate for administrator-controlled enrollment. Download does not imply trust.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Management CA PEM, content: {application/x-pem-file: {schema: {type: string}}}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /analyzers/status:
    get:
      operationId: getAnalyzerStatus
      description: Returns bounded authenticated health snapshots from the Zeek and Suricata maintenance brokers. Backend failures are isolated per engine and do not expose internal error details.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Per-engine analyzer health evidence, content: {application/json: {schema: {$ref: "#/components/schemas/AnalyzerStatusReport"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /capabilities:
    get:
      operationId: getCapabilities
      description: Returns the machine-validated feature registry, canonical glossary, and platform certification matrix. Capability claims are release metadata and never inferred from a running process alone.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Evidence-backed capability registry, content: {application/json: {schema: {$ref: "#/components/schemas/CapabilityBundle"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /cases:
    get:
      operationId: listCases
      description: Lists at most 1,024 durable cases newest-first. Case timelines are bounded and SHA-256 chained.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Durable case ledger, content: {application/json: {schema: {type: object, additionalProperties: false, required: [schema, cases], properties: {schema: {const: 1}, cases: {type: array, maxItems: 1024, items: {$ref: "#/components/schemas/Case"}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    post:
      operationId: createCase
      description: Creates an open case and its first custody-timeline entry. This does not create or apply an evidence hold.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateCaseRequest"}}}}
      responses:
        "201": {description: Created case, content: {application/json: {schema: {$ref: "#/components/schemas/Case"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /cases/{caseID}:
    get:
      operationId: getCase
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CaseID"}]
      responses:
        "200": {description: Case detail and custody timeline, content: {application/json: {schema: {$ref: "#/components/schemas/Case"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateCase
      description: Renames a case or edits its description (newlines allowed). expected_revision is optional (0 skips the check); reason defaults to a description of the change. A request matching the stored values returns the case without a new timeline entry.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CaseID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpdateCaseRequest"}}}}
      responses:
        "200": {description: Updated case, content: {application/json: {schema: {$ref: "#/components/schemas/Case"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteCase
      description: Recent confirmation, session only. Deletes the case record and its timeline; evidence artifacts are kept. A case whose hold still protects a capture answers 409 case_hold_active; release the hold first. The body is optional.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CaseID"}]
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {expected_revision: {type: integer, minimum: 0}, password: {type: string, maxLength: 1024}}}}}}
      responses:
        "200": {description: Deleted case, content: {application/json: {schema: {type: object, additionalProperties: false, required: [schema, deleted, case], properties: {schema: {const: 1}, deleted: {const: true}, case: {$ref: "#/components/schemas/Case"}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /cases/{caseID}/evidence/{evidenceID}:
    delete:
      operationId: removeCaseEvidence
      description: Detaches one evidence reference (the artifact itself is kept). A capture protected by the case hold cannot be removed until the hold is released. Closed cases must be reopened first. The body is optional.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/CaseID"}
        - {in: path, name: evidenceID, required: true, schema: {type: string, pattern: "^evidence-[a-f0-9]{32}$"}}
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {expected_revision: {type: integer, minimum: 0}, reason: {type: string, maxLength: 512}}}}}}
      responses:
        "200": {description: Updated case, content: {application/json: {schema: {$ref: "#/components/schemas/Case"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /cases/{caseID}/evidence:
    post:
      operationId: addCaseEvidence
      description: Verifies and attaches one capture, completed capture export, or event query snapshot. A QUERY_SNAPSHOT is pinned (canonical query, match count and dataset watermark) so the evidence stays meaningful after the snapshot expires. label, reason and expected_revision are optional. Attaching a reference does not protect it; a capture added while a hold is applied makes the hold PARTIAL until it is applied again.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CaseID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AddCaseEvidenceRequest"}}}}
      responses:
        "201": {description: Case with verified evidence reference, content: {application/json: {schema: {$ref: "#/components/schemas/Case"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /cases/{caseID}/hold:
    post:
      operationId: setCaseHold
      description: Recent confirmation. Idempotently applies or releases host-enforced holds on every referenced capture. ACTIVE means every capture reached the requested state; PARTIAL is an explicit incomplete result and must never be treated as protected.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/CaseID"}
        - {in: header, name: Idempotency-Key, required: false, description: "Optional; generated when omitted.", schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[!-~]{16,128}$"}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SetCaseHoldRequest"}}}}
      responses:
        "200": {description: Case with per-capture hold results, content: {application/json: {schema: {$ref: "#/components/schemas/Case"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /cases/{caseID}/status:
    put:
      operationId: setCaseStatus
      description: Recent confirmation. Changes OPEN/CLOSED status with an optional optimistic revision and custody-timeline reason. Closing a case does not release its hold.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CaseID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SetCaseStatusRequest"}}}}
      responses:
        "200": {description: Updated case, content: {application/json: {schema: {$ref: "#/components/schemas/Case"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /preflight:
    get:
      operationId: inspectPreflight
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Read-only host and firewall-backend coexistence inspection}
        "401": {$ref: "#/components/responses/Error"}
  /network/validate:
    post:
      operationId: validateNetworkPlan
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "../network-plan/network-plan.schema.json"}}}}
      responses:
        "200": {description: Semantic validation, stable host identity checks, warnings, and deterministic plan hash}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /network/preview:
    post:
      operationId: previewNetworkPlan
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "../network-plan/network-plan.schema.json"}}}}
      responses:
        "200": {description: Validation plus deterministic Netplan, firewall, command, impact, changed-object, and bound host-firewall evidence preview; never applies state}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /network/stage:
    post:
      operationId: stageNetworkPlan
      description: Durably stages a hash-matched plan without applying any host or packet-path changes.
      security: [{bearerAuth: []}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
      responses:
        "201": {description: Plan staged but explicitly not applied}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /network/staged/{applyID}/rollback:
    post:
      operationId: rollbackStagedNetworkPlan
      description: Discards an exact staged plan before apply.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: applyID, required: true, schema: {type: string}}
      responses:
        "200": {description: Stage discarded without host changes}
        "409": {$ref: "#/components/responses/Error"}
  /network/staged/{applyID}/commit:
    post:
      operationId: commitNetworkPlan
      description: Password every time. Commits a staged plan with a rollback watchdog; the returned health token must be heartbeated and the plan confirmed before the window closes or the appliance rolls back.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: applyID, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [plan_hash, password], properties: {plan_hash: {type: string, pattern: "^[a-f0-9]{64}$"}, password: {type: string, minLength: 1, maxLength: 1024}, rollback_window_seconds: {type: integer, minimum: 0}}}}}}
      responses:
        "202": {description: Commit accepted with health token and deadline}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /network/staged/{applyID}/heartbeat:
    post:
      operationId: signalNetworkHealth
      description: Proves management reachability during the rollback window using the commit's health token.
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: applyID, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [plan_hash, token], properties: {plan_hash: {type: string, pattern: "^[a-f0-9]{64}$"}, token: {type: string, maxLength: 256}}}}}}
      responses:
        "200": {description: Health signal recorded}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /network/staged/{applyID}/confirm:
    post:
      operationId: confirmNetworkPlan
      description: Password every time. Confirms a committed plan and ends the rollback window.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: applyID, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [plan_hash, password], properties: {plan_hash: {type: string, pattern: "^[a-f0-9]{64}$"}, password: {type: string, minLength: 1, maxLength: 1024}}}}}}
      responses:
        "200": {description: Confirmed staged plan}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /network/active/revert:
    post:
      operationId: revertNetworkPlan
      description: Password every time. Turns the lab network off like `shakerproxy network off` - the gateway restores the host network as it was before the running plan (Netplan, DHCP, firewall, forwarding) with the watchdog's rollback executor and returns to setup mode. If the restore fails, emergency bypass is enabled and 409 explains why.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {password: {type: string, minLength: 1, maxLength: 1024}}}}}}
      responses:
        "200": {description: "Lab network is off", content: {application/json: {schema: {type: object, required: [operating_mode, emergency_bypass], properties: {operating_mode: {type: string}, emergency_bypass: {type: boolean}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /captures:
    get:
      operationId: listCaptures
      description: Lists bounded capture sessions and current packet, drop, storage, closed-rotation analyzer-feed loss/error, and hash-manifest evidence.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Capture session list}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    post:
      operationId: startCapture
      description: Starts one bounded capture on the lab interface from the confirmed routed plan. Callers cannot select a host path, interface, service, command, or raw BPF expression.
      security: [{bearerAuth: []}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StartCaptureRequest"}
      responses:
        "201": {description: Capture worker accepted}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /captures/import:
    post:
      operationId: importCapture
      description: "Imports a .pcapng captured elsewhere (for example the UniFi gateway's own packet capture, or tcpdump on another box) as a finalized capture the offline analyzers process. The upload is multipart/form-data with a 'file' part and optional 'name' and 'description' fields, streamed to the gateway in bounded chunks. Events keep the packets' own timestamps, so the import appears under its real time window and is scoped by capture_session_id. A classic .pcap is refused with how to convert it; the uploaded file name is never used for any path."
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
                name: {type: string, maxLength: 96}
                description: {type: string, maxLength: 1024}
      responses:
        "201": {description: Capture imported and queued for analysis}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
  /captures/lab-recording:
    put:
      operationId: setLabRecording
      description: Turns automatic lab recording on or off. While it is on, the gateway records lab traffic (a 24-hour full-packet ring, restarted automatically; the last two finished recordings are kept) whenever a confirmed lab plan routes. A manual capture replaces it until the manual capture ends. GET /system/status reports the current state as lab_recording.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        "200":
          description: Lab recording state after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: {type: boolean}
                  recording: {type: boolean}
                  session_id: {type: string}
                  manual: {type: boolean, description: A manual capture runs in place of the automatic recording}
                  reason: {type: string, description: Why the lab is not being recorded, in plain language}
                  checked_at: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /captures/{sessionID}:
    get:
      operationId: getCaptureStats
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/CaptureSessionID"}
      responses:
        "200": {description: Live capture, analyzer rotation-feed health, or finalized hash-manifest statistics}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /captures/{sessionID}/stop:
    post:
      operationId: stopCapture
      description: Requests an asynchronous graceful stop. The worker finalizes hashes before its service exits.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/CaptureSessionID"}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        "202": {description: Graceful capture stop requested}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /captures/{sessionID}/deletion-preview:
    post:
      operationId: previewCaptureDeletion
      description: Produces one immutable preview over the overlapping validity window of host artifacts, normalized events, and both analyzer checkpoints. It binds manifest-validated PCAP/session files, pending ingest spool files, PostgreSQL event and exclusively removable identity rows, exact Zeek/Suricata checkpoint evidence, immediate versus maintenance-dependent reclaim estimates, existing export records, and retained external boundaries.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/CaptureSessionID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        "200": {description: Immutable bounded deletion preview, content: {application/json: {schema: {$ref: "#/components/schemas/CaptureDeletionPreview"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /capture-deletion-jobs/{jobID}/cancel:
    post:
      operationId: cancelCaptureDeletion
      description: Reauthenticates the original administrator and durably cancels a persisted PENDING job only while every backend remains NOT_STARTED. Cancellation is idempotent and rejected after the normalized-event replay barrier begins.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobID, required: true, schema: {type: string, pattern: "^capture-delete-operation-[a-f0-9]{32}$"}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RetryCaptureDeletionRequest"}
      responses:
        "200": {description: Safely cancelled deletion job, content: {application/json: {schema: {$ref: "#/components/schemas/CaptureDeletionJob"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /captures/{sessionID}/deletion-jobs:
    post:
      operationId: deleteCapture
      description: Reauthenticates the administrator, persists an idempotent control-plane operation, writes and verifies normalized-event replay barriers, deletes both analyzer checkpoints, then requests manifest-bound host artifact deletion. Completion requires exact acknowledgements from all four backends; a later analyzer or host failure remains PARTIAL and an event-barrier failure stops before either analyzer or host deletion.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/CaptureSessionID"}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeleteCaptureRequest"}
      responses:
        "202": {description: Durable deletion job, content: {application/json: {schema: {$ref: "#/components/schemas/CaptureDeletionJob"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /capture-deletion-jobs:
    get:
      operationId: listCaptureDeletionJobs
      description: Lists at most 1,024 durable control-plane deletion jobs with independent normalized-event, Zeek-checkpoint, Suricata-checkpoint, and host-artifact outcomes. Legacy schema-1 two-backend jobs remain readable.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Bounded capture deletion job history
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [jobs]
                properties:
                  jobs: {type: array, maxItems: 1024, items: {$ref: "#/components/schemas/CaptureDeletionJob"}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /capture-deletion-jobs/{jobID}:
    get:
      operationId: getCaptureDeletionJob
      description: Returns one durable coordinated deletion job and its immutable per-backend acknowledgements or bounded failures.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobID, required: true, schema: {type: string, pattern: "^capture-delete-operation-[a-f0-9]{32}$"}}
      responses:
        "200": {description: Coordinated capture deletion job, content: {application/json: {schema: {$ref: "#/components/schemas/CaptureDeletionJob"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /capture-deletion-jobs/{jobID}/retry:
    post:
      operationId: retryCaptureDeletion
      description: Reauthenticates the original administrator and durably resumes only unfinished or failed backends. Completed backend acknowledgements are immutable and skipped. The new retry intent is idempotent, and startup recovery resumes persisted in-progress work without repeating completed backends. A retry reuses the original reviewed preview and can therefore remain failed after that preview expires or becomes stale.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobID, required: true, schema: {type: string, pattern: "^capture-delete-operation-[a-f0-9]{32}$"}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RetryCaptureDeletionRequest"}
      responses:
        "202": {description: Durable retried deletion job, content: {application/json: {schema: {$ref: "#/components/schemas/CaptureDeletionJob"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /capture-deletion-jobs/{jobID}/supersede:
    post:
      operationId: supersedeCaptureDeletion
      description: Reauthenticates the original administrator and replaces stale evidence only for unfinished backends with a newer immutable preview. Completed irreversible acknowledgements remain bound to their earlier previews and are never invoked again. Supersession history and idempotency evidence are durable and bounded.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobID, required: true, schema: {type: string, pattern: "^capture-delete-operation-[a-f0-9]{32}$"}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SupersedeCaptureDeletionRequest"}
      responses:
        "202": {description: Superseded durable deletion job, content: {application/json: {schema: {$ref: "#/components/schemas/CaptureDeletionJob"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /capture-retention/preview:
    post:
      operationId: previewCaptureRetention
      description: Freezes and durably records a ten-minute, read-only preview of deterministic age and PCAP-byte retention across at most 1,024 finalized named captures. For every selected capture it binds the exact host artifacts, normalized-event rows, Zeek and Suricata analyzer checkpoints, exclusive identities, pending ingest spool, packet-membership limitations, and export warnings that automatic cleanup will use. Active/unfinalized sessions are excluded, retention locks are preserved, and unresolved shared-PCAP collateral is not claimed known.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CaptureRetentionPolicyInput"}
      responses:
        "200": {description: Immutable exact cross-backend retention preview, content: {application/json: {schema: {$ref: "#/components/schemas/CaptureRetentionPreview"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /capture-retention/policy:
    get:
      operationId: getCaptureRetentionPolicy
      description: Returns the current revisioned host capture-retention policy. Revision zero is a safe disabled default.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Current capture-retention policy, content: {application/json: {schema: {$ref: "#/components/schemas/CaptureRetentionPolicy"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    put:
      operationId: applyCaptureRetentionPolicy
      description: Reauthenticates the administrator and atomically saves a new policy revision only when the expected revision and unexpired exact preview still match. Enabling starts the first deterministic automatic cadence after one full interval.
      security: [{bearerAuth: []}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApplyCaptureRetentionPolicyRequest"}
      responses:
        "200": {description: Atomically persisted policy revision, content: {application/json: {schema: {$ref: "#/components/schemas/CaptureRetentionPolicy"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /capture-retention/runs:
    get:
      operationId: listCaptureRetentionRuns
      description: Lists at most 1,024 durable manual retention runs newest first, including exact per-capture outcomes and remaining bytes.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Bounded retention run history
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [runs]
                properties:
                  runs: {type: array, maxItems: 1024, items: {$ref: "#/components/schemas/CaptureRetentionRun"}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    post:
      operationId: startCaptureRetentionRun
      description: Reauthenticates the administrator, verifies the current policy revision and the full previously persisted cross-backend preview, records every selected capture and its stable deletion request, then deletes normalized events before host artifacts and durably reports complete, partial, or failed outcomes. Restart recovery reuses the reviewed preview rather than refreshing it. The saved policy may remain automatic-execution disabled.
      security: [{bearerAuth: []}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StartCaptureRetentionRunRequest"}
      responses:
        "202": {description: Durable final or resumable retention run, content: {application/json: {schema: {$ref: "#/components/schemas/CaptureRetentionRun"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /capture-retention/scheduler:
    get:
      operationId: getCaptureRetentionSchedulerStatus
      description: Returns the enabled state, current policy revision, next cadence slot, and most recent automatic run evidence.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Capture retention scheduler status, content: {application/json: {schema: {$ref: "#/components/schemas/CaptureRetentionSchedulerStatus"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /captures/{sessionID}/exports:
    get:
      operationId: listCaptureExports
      description: Lists the durable delivery history for one capture session, including interrupted range transfers.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/CaptureSessionID"}
      responses:
        "200":
          description: Session-scoped export history
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [exports]
                properties:
                  exports: {type: array, maxItems: 4096, items: {$ref: "#/components/schemas/CaptureExportRecord"}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /captures/{sessionID}/files/{fileName}/export:
    post:
      operationId: exportCaptureArtifact
      description: Reauthenticates the administrator and streams only an exact finalized manifest file. Supports one explicit bytes range for bounded resumable delivery and returns the whole-file SHA-256 in integrity headers.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/CaptureSessionID"}
        - {in: path, name: fileName, required: true, schema: {type: string, maxLength: 255, pattern: "^[^/\\\\\\r\\n]+\\.pcap(ng)?$"}}
        - {in: header, name: Range, required: false, schema: {type: string, pattern: "^bytes=[0-9]+-[0-9]*$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties: {password: {type: string, minLength: 1, maxLength: 1024}}
      responses:
        "200": {description: Complete PCAP or PCAPNG artifact, headers: {Accept-Ranges: {schema: {const: bytes}}, Digest: {schema: {type: string}}, X-ShakerProxy-SHA256: {schema: {type: string, pattern: "^[a-f0-9]{64}$"}}}, content: {application/vnd.tcpdump.pcap: {schema: {type: string, format: binary}}}}
        "206": {description: Requested artifact byte range, headers: {Content-Range: {schema: {type: string}}, X-ShakerProxy-SHA256: {schema: {type: string, pattern: "^[a-f0-9]{64}$"}}}, content: {application/vnd.tcpdump.pcap: {schema: {type: string, format: binary}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "416": {$ref: "#/components/responses/Error"}
        "507": {$ref: "#/components/responses/Error"}
  /lab-routing:
    get:
      operationId: getLabRouting
      description: "Which devices seen on the lab network in the last 10 minutes send their traffic through ShakerProxy. A device that took the router's DHCP in a single-arm lab uses the router as its gateway; ShakerProxy then records only its DHCP request and its multicast (mDNS, SSDP) and reports it as BYPASSING, with the reason and ShakerProxy's and the router's addresses for the fix. Such devices are also added to the device inventory (evidence OBSERVED_LAN). Judged at most every 15 seconds; available is false without a routed lab or readable recorded traffic."
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Lab routing report, content: {application/json: {schema: {$ref: "#/components/schemas/LabRoutingReport"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /devices:
    get:
      operationId: listDevices
      description: Reconciles bounded read-only Kea DHCPv4 lease evidence into durable, time-bounded device attribution. When a routed network plan is confirmed, each new interval is bound to its lab interface, optional VLAN, and plan hash; legacy intervals retain explicit unknown scope. An IP address is evidence and is never a device identity, unless an administrator named the device by it (pinned_address).
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: view, schema: {type: string, enum: [all, online, recent], default: all}, description: Recent means seen within 24 hours of the inventory snapshot.}
        - {in: query, name: q, schema: {type: string, maxLength: 128}, description: Case-insensitive substring over current/historical names, metadata, identities, addresses, hostnames, tags, and vendor evidence.}
        - {in: query, name: interface, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,14}$"}}
        - {in: query, name: vlan_id, schema: {type: integer, minimum: 1, maximum: 4094}}
        - {in: query, name: vendor, schema: {type: string, maxLength: 256}}
        - {in: query, name: category, schema: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"}}
        - {in: query, name: tag, schema: {type: string, minLength: 1, maxLength: 64}, description: Exact canonical lower-case tag, including spaces when present in stored metadata.}
        - {in: query, name: ip_family, schema: {type: string, enum: [ipv4, ipv6]}, description: Requires at least one time-bounded address observation in this family.}
        - {in: query, name: min_confidence, schema: {type: integer, minimum: 0, maximum: 100}}
        - {in: query, name: warnings, schema: {type: string, enum: [present, none]}, description: Selects devices with or without current attribution warnings.}
        - {in: query, name: sort, schema: {type: string, enum: [name, last_seen, first_seen, confidence], default: last_seen}}
        - {in: query, name: direction, schema: {type: string, enum: [asc, desc], default: desc}}
      responses:
        "200": {description: Device inventory snapshot, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceInventorySnapshot"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    post:
      operationId: nameDeviceAddress
      description: Recent confirmation. Names the device at an IP address, like a router's client alias, and pins the address to it so every MAC address seen there (for example a phone's rotating private Wi-Fi MAC) joins it. Names the device currently or most recently at the address, or the device given by device_id, or creates a device that waits to be seen. Earlier records seen only at the address join the named device.
      security: [{bearerAuth: []}]
      parameters:
        - {in: header, name: Idempotency-Key, required: false, description: "Optional. When omitted the server generates one; send your own to make retries replay safely.", schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [name, address], properties: {name: {type: string, minLength: 1, maxLength: 64}, address: {type: string, maxLength: 45, description: "A unicast IPv4 or IPv6 address, such as 192.168.10.201"}, device_id: {type: string, pattern: "^device-[a-f0-9]{32}$"}, password: {type: string, maxLength: 1024}}}}}}
      responses:
        "200": {description: Named device or exact replay, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceMutationResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /devices/resolve:
    get:
      operationId: resolveDevice
      description: Resolves a friendly name, IP address, MAC address, or device ID to devices. Order is exact ID, exact MAC (any case/separator), exact current IP (then the most recent holder), exact name (case-insensitive), name prefix, then name substring; the first level that matches is returned, at most 20 matches. unique is true when exactly one device matched. Requires an administrator session or devices:read.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: q, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        "200": {description: Matching devices, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceResolution"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /address-aliases:
    get:
      operationId: listAddressAliases
      description: Lists manual address aliases with conflict annotations.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Address aliases, content: {application/json: {schema: {type: object, additionalProperties: false, required: [schema, address_aliases], properties: {schema: {const: 1}, address_aliases: {type: array, maxItems: 4096, items: {$ref: "#/components/schemas/AddressAlias"}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    post:
      operationId: createAddressAlias
      description: Recent confirmation. Creates an audited manual IPv4/IPv6 address or CIDR name scoped to one interface, optional VLAN, and validity interval. This never changes stable device identity or silently rewrites historical attribution.
      security: [{bearerAuth: []}]
      parameters:
        - {in: header, name: Idempotency-Key, required: false, description: "Optional. When omitted the server generates one; send your own to make retries replay safely.", schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AddressAliasCreateRequest"}}}}
      responses:
        "201": {description: Address alias created, content: {application/json: {schema: {$ref: "#/components/schemas/AddressAliasMutationResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /device-aliases/export:
    get:
      operationId: exportDeviceAliases
      description: Downloads a deterministic bounded snapshot containing only immutable device IDs, current friendly names, alias revisions, and tags. Owner, notes, addresses, credentials, and traffic are excluded.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: format, required: true, schema: {type: string, enum: [json, csv]}}
      responses:
        "200":
          description: No-store JSON or RFC 4180 CSV attachment. The CSV tags_json cell is a JSON string array.
          content:
            application/json: {schema: {$ref: "#/components/schemas/AliasTagExport"}}
            text/csv: {schema: {type: string, maxLength: 67108864}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /device-aliases/import-preview:
    post:
      operationId: previewDeviceAliasImport
      description: Strictly parses a bounded ShakerProxy JSON or RFC 4180 CSV alias/tag export and returns a non-mutating exact preview. Missing devices and stale alias revisions are blockers.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AliasTagImportPreviewRequest"}}}}
      responses:
        "200": {description: No-store exact import preview, content: {application/json: {schema: {$ref: "#/components/schemas/AliasTagImportPreview"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /device-aliases/import:
    post:
      operationId: applyDeviceAliasImport
      description: Reauthenticates and atomically applies an exact unexpired preview. Any alias-revision or tag-hash drift rejects the complete batch before mutation.
      security: [{bearerAuth: []}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AliasTagImportApplyRequest"}}}}
      responses:
        "200": {description: Atomic audited import or exact replay, content: {application/json: {schema: {$ref: "#/components/schemas/AliasTagImportResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /address-aliases/{aliasID}:
    delete:
      operationId: deleteAddressAlias
      description: Recent confirmation. Deletes an address alias and appends a hash-chained audit event. The body is optional; expected_revision 0 skips the revision check.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: aliasID, required: true, schema: {type: string, pattern: "^address-alias-[a-f0-9]{32}$"}}
        - {in: header, name: Idempotency-Key, required: false, description: "Optional. When omitted the server generates one; send your own to make retries replay safely.", schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {password: {type: string, maxLength: 1024}, reason: {type: string, maxLength: 128}, expected_revision: {type: integer, minimum: 0}}}}}}
      responses:
        "200": {description: Deleted alias or exact idempotent replay, content: {application/json: {schema: {$ref: "#/components/schemas/AddressAliasMutationResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
    put:
      operationId: updateAddressAlias
      description: Recent confirmation. Replaces an exact address-alias scope using optimistic revision control and appends a hash-chained audit event. A request matching the stored alias returns it with unchanged true.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: aliasID, required: true, schema: {type: string, pattern: "^address-alias-[a-f0-9]{32}$"}}
        - {in: header, name: Idempotency-Key, required: false, description: "Optional. When omitted the server generates one; send your own to make retries replay safely.", schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AddressAliasUpdateRequest"}}}}
      responses:
        "200": {description: Address alias revision or exact idempotent replay, content: {application/json: {schema: {$ref: "#/components/schemas/AddressAliasMutationResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /address-aliases/resolve:
    get:
      operationId: resolveAddressAlias
      description: Resolves an exact address/interface/VLAN/time scope. Longest-prefix, VLAN-specific, priority, and confidence ordering is deterministic; an equal-rank disagreement fails closed as a conflict.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: address, required: true, schema: {type: string, maxLength: 64}}
        - {in: query, name: interface, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,14}$"}}
        - {in: query, name: vlan_id, schema: {type: integer, minimum: 1, maximum: 4094}}
        - {in: query, name: at, required: false, description: "Defaults to now.", schema: {type: string, format: date-time}}
      responses:
        "200": {description: Bounded address alias resolution evidence, content: {application/json: {schema: {$ref: "#/components/schemas/AddressAliasResolution"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /devices/{deviceID}:
    get:
      operationId: getDevice
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: deviceID, required: true, schema: {type: string, pattern: "^device-[a-f0-9]{32}$"}}
      responses:
        "200": {description: Device identity and time-bounded evidence, content: {application/json: {schema: {$ref: "#/components/schemas/Device"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /devices/{deviceID}/ca-trust:
    put:
      operationId: setDeviceCATrust
      description: Records whether the ShakerProxy interception CA is installed on the device. Reports use it to tell expected decryption (INSTALLED) from a device that accepts untrusted certificates (NOT_INSTALLED). Audited in the device audit log as DEVICE_CA_TRUST_UPDATED; no password prompt. Setting the current state again returns 200 without a new audit entry. Requires an administrator session or lab:write; no password prompt.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: deviceID, required: true, schema: {type: string, minLength: 1, maxLength: 128}, description: "Any device reference: friendly name, IP address, MAC address (any case or separator), or device ID."}
        - {in: header, name: Idempotency-Key, required: false, schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]+$"}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [state], properties: {state: {$ref: "#/components/schemas/CATrust"}}}}}}
      responses:
        "200": {description: Current CA trust state, content: {application/json: {schema: {$ref: "#/components/schemas/CATrustResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /devices/{deviceID}/compare:
    get:
      operationId: compareDeviceRuns
      description: Compares two runs of one device, each chosen by test session ID (base, compare) or by RFC 3339 range (base_start/base_end, compare_start/compare_end, at most 31 days). Reports added/removed domains and protocols, new/resolved findings, and TLS hosts that newly fail or are newly decrypted. Requires an administrator session or devices:read plus traffic:read.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: deviceID, required: true, schema: {type: string, minLength: 1, maxLength: 128}, description: "Any device reference: friendly name, IP address, MAC address (any case or separator), or device ID."}
        - {in: query, name: base, schema: {type: string, pattern: "^ts-[a-f0-9]{24}$"}}
        - {in: query, name: compare, schema: {type: string, pattern: "^ts-[a-f0-9]{24}$"}}
        - {in: query, name: base_start, schema: {type: string, format: date-time}}
        - {in: query, name: base_end, schema: {type: string, format: date-time}}
        - {in: query, name: compare_start, schema: {type: string, format: date-time}}
        - {in: query, name: compare_end, schema: {type: string, format: date-time}}
      responses:
        "200": {description: What changed between the runs, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceComparison"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /devices/{deviceID}/controls:
    parameters:
      - {in: path, name: deviceID, required: true, schema: {type: string, minLength: 1, maxLength: 128}, description: "Device ID, MAC (any separator), current IP or friendly name. Ambiguous references return 409 device_ambiguous with candidates; unknown ones 404 device_not_found."}
    get:
      operationId: getDeviceControls
      description: The device's lab controls (Decrypt HTTPS, internet, blocked domains) and whether they are enforced right now, with plain-language notes. Session or devices:read token.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Current device controls, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceControls"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    put:
      operationId: putDeviceControls
      description: "Changes any of the given controls; omitted fields keep their value. decrypt_https adds the device to HTTPS decryption for selected devices (turning it on when the CA exists) and blocks QUIC for it; internet BLOCK drops the device's traffic leaving the lab (matched by MAC, falling back to current IPs); blocked_domains answer NXDOMAIN, subdomains included, through ShakerProxy DNS. Revisioned and audited through the traffic-policy apply path. Session or lab:write token; no password."
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceControlsUpdate"}}}}
      responses:
        "200": {description: Controls after the change, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceControls"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /devices/{deviceID}/metadata:
    put:
      operationId: updateDeviceMetadata
      description: Reauthenticates the administrator and atomically patches bounded owner, location, category, allowlisted icon, tags, and notes. Omitted fields are preserved and explicit empty values clear them, preserving older clients. The legacy friendly_name field creates a revisioned alias change.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: deviceID, required: true, schema: {type: string, pattern: "^device-[a-f0-9]{32}$"}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceMetadataUpdateRequest"}}}}
      responses:
        "200": {description: Audited metadata replacement or exact idempotent replay, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceMutationResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /devices/{deviceID}/report:
    get:
      operationId: getDeviceReport
      description: Plain-language report of what the device did and whether it is secure, built from bounded traffic metadata. Choose the range with session (a test session ID), window (15m, 1h, 6h, 24h, 7d, 30d), or start/end (RFC 3339, at most 31 days); with none, the device's running test session is used, otherwise the last 24 hours. Findings are raised only from observed evidence. Requires an administrator session or devices:read plus traffic:read.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: deviceID, required: true, schema: {type: string, minLength: 1, maxLength: 128}, description: "Any device reference: friendly name, IP address, MAC address (any case or separator), or device ID."}
        - {in: query, name: window, schema: {type: string, enum: [15m, 1h, 6h, 24h, 7d, 30d]}}
        - {in: query, name: session, schema: {type: string, pattern: "^ts-[a-f0-9]{24}$"}}
        - {in: query, name: start, schema: {type: string, format: date-time}}
        - {in: query, name: end, schema: {type: string, format: date-time}}
      responses:
        "200": {description: Device report, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceReport"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /devices/{deviceID}/traffic-deletion-preview:
    post:
      operationId: previewDeviceTrafficDeletion
      description: Exact packet-impact dry run for time-bounded device MAC/IP evidence. It binds the executable database/spool metadata deletion preview and per-session analyzer checkpoints, scans manifest-bound PCAPNG packets, reports unrelated whole-file collateral, and exposes all four shared-PCAP choices. Exactness applies only to the supplied identity windows; identity_evidence_covers_range separately states whether those windows cover the requested interval. Metadata-only and sanitize/rewrite execution are available when their evidence is eligible.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: deviceID, required: true, schema: {type: string, pattern: "^device-[a-f0-9]{32}$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeviceTrafficDeletionPreviewInput"}
      responses:
        "200": {description: Immutable no-store deletion-choice preview, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceTrafficDeletionPreview"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /devices/{deviceID}/traffic-deletion-jobs:
    post:
      operationId: createDeviceTrafficDeletionJob
      description: Creates an idempotent, reauthenticated job that durably executes DELETE_METADATA_ONLY or SANITIZE_AND_REWRITE_PCAP against an exact unexpired preview. Derived-content deletion removes selected normalized events and both analyzer checkpoint generations while retaining every raw PCAP byte; body, key-log, Arkime, and OpenSearch stores are absent from this build and are never reported as deleted. Sanitize jobs remain running until both analyzers complete the replacement manifests.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: deviceID, required: true, schema: {type: string, pattern: "^device-[a-f0-9]{32}$"}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateDeviceTrafficDeletionJobRequest"}}}}
      responses:
        "202": {description: Durable device-traffic deletion job, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceTrafficDeletionJob"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /device-traffic-deletion-jobs:
    get:
      operationId: listDeviceTrafficDeletionJobs
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Durable device traffic deletion jobs
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [jobs]
                properties:
                  jobs: {type: array, maxItems: 1024, items: {$ref: "#/components/schemas/DeviceTrafficDeletionJob"}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /device-traffic-deletion-jobs/{jobID}:
    get:
      operationId: getDeviceTrafficDeletionJob
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobID, required: true, schema: {type: string, pattern: "^device-traffic-delete-[a-f0-9]{32}$"}}
      responses:
        "200": {description: Durable device traffic deletion job, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceTrafficDeletionJob"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /device-traffic-deletion-jobs/{jobID}/retry:
    post:
      operationId: retryDeviceTrafficDeletionJob
      description: Reauthenticates and retries a PARTIAL job with its original immutable preview and operation ID.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobID, required: true, schema: {type: string, pattern: "^device-traffic-delete-[a-f0-9]{32}$"}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceTrafficDeletionActionRequest"}}}}
      responses:
        "202": {description: Retried job, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceTrafficDeletionJob"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /device-traffic-deletion-jobs/{jobID}/cancel:
    post:
      operationId: cancelDeviceTrafficDeletionJob
      description: Cancels only a persisted PENDING job before the replay barrier phase begins; later cancellation fails closed.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobID, required: true, schema: {type: string, pattern: "^device-traffic-delete-[a-f0-9]{32}$"}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceTrafficDeletionActionRequest"}}}}
      responses:
        "200": {description: Safely cancelled job, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceTrafficDeletionJob"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /devices/{deviceID}/alias:
    put:
      operationId: updateDeviceAlias
      description: Recent confirmation. Appends one optimistic-concurrency-protected friendly-name revision. Duplicate friendly names are allowed but flagged. Setting the current name returns 200 with unchanged true.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: deviceID, required: true, schema: {type: string, pattern: "^device-[a-f0-9]{32}$"}}
        - {in: header, name: Idempotency-Key, required: false, description: "Optional. When omitted the server generates one; send your own to make retries replay safely.", schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeviceAliasUpdateRequest"}
      responses:
        "200": {description: Alias revision committed or idempotently replayed, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceMutationResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /devices/{deviceID}/pinned-address:
    delete:
      operationId: unpinDeviceAddress
      description: Recent confirmation. Stops naming the device by its IP address; it keeps its name. A device added by address that was never seen is removed.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: deviceID, required: true, schema: {type: string, pattern: "^device-[a-f0-9]{32}$"}}
        - {in: header, name: Idempotency-Key, required: false, description: "Optional. When omitted the server generates one; send your own to make retries replay safely.", schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {password: {type: string, maxLength: 1024}}}}}}
      responses:
        "200": {description: Updated device, an empty list when it was removed, or an exact replay, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceMutationResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /devices/{deviceID}/merge:
    post:
      operationId: mergeDevice
      description: Recent confirmation. Merges the source device's evidence into this device and removes the source record; both are recorded in the device audit.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: deviceID, required: true, schema: {type: string, pattern: "^device-[a-f0-9]{32}$"}}
        - {in: header, name: Idempotency-Key, required: false, description: "Optional. When omitted the server generates one; send your own to make retries replay safely.", schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [source_device_id], properties: {source_device_id: {type: string, pattern: "^device-[a-f0-9]{32}$"}, password: {type: string, maxLength: 1024}}}}}}
      responses:
        "200": {description: Merged device or exact replay, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceMutationResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /devices/{deviceID}/split:
    post:
      operationId: splitDevice
      description: Recent confirmation. Moves exactly selected identities, addresses and hostnames into a new device record.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: deviceID, required: true, schema: {type: string, pattern: "^device-[a-f0-9]{32}$"}}
        - {in: header, name: Idempotency-Key, required: false, description: "Optional. When omitted the server generates one; send your own to make retries replay safely.", schema: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [selection], properties: {password: {type: string, maxLength: 1024}, selection: {type: object, description: "identities, addresses, hostnames and metadata selectors that must match stored evidence exactly"}}}}}}
      responses:
        "201": {description: Source and new device, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceMutationResult"}}}}
        "200": {description: Exact replay, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceMutationResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /device-audit:
    get:
      operationId: listDeviceAudit
      description: Newest-first page of the hash-chained device audit ledger (renames, tags, merges, splits, address aliases). Pass next_cursor as before to read older events. When the ledger is full the oldest events move to an append-only archive file on the appliance; archived_events counts them.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {in: query, name: before, schema: {type: string, pattern: "^audit-[a-f0-9]{32}$"}}
      responses:
        "200": {description: Audit page, content: {application/json: {schema: {$ref: "#/components/schemas/DeviceAuditPage"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /ingest/status:
    get:
      operationId: getIngestStatus
      description: Event ingestion counters and freshness.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Ingestion status}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /events/{recordID}:
    get:
      operationId: getEventDetail
      description: One normalized event with its bounded detail projection.
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: recordID, required: true, schema: {type: string, pattern: "^[a-f0-9]{64}$"}}]
      responses:
        "200": {description: Event detail}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /events:
    get:
      operationId: listRecentEvents
      description: Returns a bounded metadata-only page. The optional typed query is parsed into an allowlisted AST and compiled to parameterized backend predicates; arbitrary SQL, regex, payload search, and engine DSL are not accepted.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {in: query, name: cursor, schema: {type: string, maxLength: 256}}
        - {in: query, name: source, schema: {type: string, enum: [HOST, ZEEK, SURICATA, MITMPROXY]}}
        - {in: query, name: kind, schema: {type: string, maxLength: 256}}
        - {in: query, name: capture_session_id, schema: {type: string, pattern: "^capture-[a-f0-9]{32}$"}}
        - {in: query, name: device_id, schema: {type: string, pattern: "^device-[a-f0-9]{32}$"}}
        - {in: query, name: q, description: "Typed filter over source, kind, device.id, device.name (aliases name and device), device.tag (alias tag), capture.id, src.ip, dst.ip, src.port, dst.port, protocol (transport), service, app.protocol (aliases proto and app; a catalog ID such as mqtt), protocol.category, protocol.visibility, protocol.exotic, dns.query, dns.rcode, tls.sni, tls.state, tls.pinning, http.host, http.method, http.path, http.status, bytes, confidence, and time. A bare word searches DNS names, TLS server names, and HTTP hosts (netflix). Time accepts bounded relative values such as last_15m, RFC3339 timestamps, or a date (the whole UTC day). Exact device-name matches search current and retained historical aliases case-insensitively; device tags use current normalized inventory metadata.", schema: {type: string, maxLength: 2048}}
      responses:
        "200": {description: Stable newest-first event page with canonical_query when q was supplied, content: {application/json: {schema: {$ref: "#/components/schemas/RecentEventPage"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /events/summary:
    get:
      operationId: getEventSummary
      description: >-
        Timeline, facet counts and totals for the live Traffic view and SOC agents, over the same filter as /events.
        Each event is counted once under one stream type (dns, tls, quic, http, discovery, alert, other, blocked; rules in
        docs/traffic-stream-types.md), and the analyzers' duplicate records are left out as the view's All filter does.
        The window is [from, to); without from and to it is the q's time:last_… window, else the last 15 minutes ending now.
        Counts are exact except the organization and category facets, which cover the newest 20,000 matching events
        (exact false and sampled_events set). Requires traffic:read; device labels are friendly names.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: from, description: "Start of the window (RFC 3339). Without to, the window ends now.", schema: {type: string, format: date-time}}
        - {in: query, name: to, description: "End of the window (RFC 3339), exclusive; at most 30 days after from and at least one second.", schema: {type: string, format: date-time}}
        - {in: query, name: buckets, schema: {type: integer, minimum: 1, maximum: 240, default: 60}}
        - {in: query, name: source, schema: {type: string, enum: [HOST, ZEEK, SURICATA, MITMPROXY]}}
        - {in: query, name: kind, schema: {type: string, maxLength: 256}}
        - {in: query, name: capture_session_id, schema: {type: string, pattern: "^capture-[a-f0-9]{32}$"}}
        - {in: query, name: device_id, schema: {type: string, pattern: "^device-[a-f0-9]{32}$"}}
        - {in: query, name: q, description: "The same typed filter accepted by /events.", schema: {type: string, maxLength: 2048}}
      responses:
        "200": {description: Events summary, content: {application/json: {schema: {$ref: "#/components/schemas/EventSummary"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /events/query-metadata:
    get:
      operationId: getEventQueryMetadata
      description: Returns the bounded parser vocabulary used for accessible field, operator, enum-value, and example autocomplete. It contains no event rows, payloads, inventory names, or backend schema.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Versioned typed-query autocomplete metadata, content: {application/json: {schema: {$ref: "#/components/schemas/QueryMetadata"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /events/query-completions:
    get:
      operationId: completeEventQueryValue
      description: Returns bounded prefix matches for current and retained historical device aliases or current normalized device tags. Values come from one cached inventory revision and contain no device IDs or event evidence.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: field, required: true, schema: {type: string, enum: [device.name, device.tag]}}
        - {in: query, name: prefix, schema: {type: string, maxLength: 128}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 20, default: 10}}
      responses:
        "200": {description: Bounded inventory-backed value completions, content: {application/json: {schema: {$ref: "#/components/schemas/QueryValueCompletionPage"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /events/live:
    get:
      operationId: streamLiveEvents
      description: Streams bounded metadata-only event batches as authenticated server-sent events. The opaque received-time cursor resumes strictly after the last delivered record. Connections, batches, query duration, response bytes, write time, and reconnect state are bounded; raw analyzer payloads are never included.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {in: query, name: cursor, required: true, schema: {type: string, maxLength: 256}}
        - {in: query, name: source, schema: {type: string, enum: [HOST, ZEEK, SURICATA, MITMPROXY]}}
        - {in: query, name: kind, schema: {type: string, maxLength: 256}}
        - {in: query, name: capture_session_id, schema: {type: string, pattern: "^capture-[a-f0-9]{32}$"}}
        - {in: query, name: device_id, schema: {type: string, pattern: "^device-[a-f0-9]{32}$"}}
        - {in: query, name: q, description: "The same canonical typed filter accepted by /events.", schema: {type: string, maxLength: 2048}}
      responses:
        "200": {description: "SSE stream. Each events frame contains one LiveEventBatch JSON object and uses its next_cursor as the SSE id.", content: {text/event-stream: {schema: {type: string}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /events/{recordID}/http-exchange:
    get:
      operationId: getHTTPExchange
      description: >-
        An administrator session, or an API token with the sensitive traffic:content scope (traffic:read
        tokens are refused: headers and bodies are plaintext evidence). Token callers get the exchanges with
        credentials removed on the server (Authorization, Cookie, Set-Cookie and other credential header
        values, credential-looking query parameters, form and JSON fields replaced by "[redacted]") and the
        response header X-ShakerProxy-HTTP-Exchange: credentials-redacted; sessions see them as recorded.
        Returns the HTTP/1.x request/response exchanges of the event's connection, like "Follow HTTP stream":
        for cleartext HTTP read back from the packet recording's closed files around the event time (bounded
        to 12 files and 320 KiB per direction, bodies previewed up to 64 KiB after chunked and gzip/deflate
        decoding, binary bodies as a hex dump of the first 256 bytes); for decrypted HTTPS from the request
        and response events mitmproxy recorded, subject to content retention. State UNAVAILABLE carries a
        plain reason (encrypted, headers-only recording, files already replaced); RETRY means the part of the
        recording is still being written. Each read is logged with the administrator or token name.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: recordID, required: true, schema: {type: string, pattern: "^[a-f0-9]{64}$"}}
      responses:
        "200": {description: The connection's exchanges or why they are unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/HTTPExchange"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /protocols:
    get:
      operationId: listProtocols
      description: "Protocol discovery. Summarizes which application protocols lab devices used in the window, how they were identified, and how much of the traffic ShakerProxy can see into. Requires traffic:read. Flows are counted once: zeek.conn rows are a capture's flows, suricata.flow rows count only for captures Zeek did not analyze, a mitmproxy TLS outcome counts only when no passive flow has the same 5-tuple within 10 minutes (and otherwise marks that flow DECRYPTED), and application-layer records (DNS, HTTP, TLS handshakes, alerts) add events but never flows. Bounds: 256 protocols, 50 devices and 20 ports per protocol; truncated is true when a bound or the 500,000 scanned-event limit was hit."
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ProtocolWindow"}
        - {in: query, name: device, description: "Limit to one device. Accepts a device ID (device-<32 hex>).", schema: {type: string, maxLength: 256}}
        - {$ref: "#/components/parameters/ProtocolCategory"}
        - {$ref: "#/components/parameters/ProtocolExotic"}
      responses:
        "200": {description: Protocol discovery summary, content: {application/json: {schema: {$ref: "#/components/schemas/ProtocolSummary"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /protocols/catalog:
    get:
      operationId: getProtocolCatalog
      description: Lists every protocol ShakerProxy can name, its category, default visibility, whether it is exotic, and the well-known ports used when no analyzer confirmed it. Requires traffic:read.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Protocol catalog, content: {application/json: {schema: {$ref: "#/components/schemas/ProtocolCatalog"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /devices/{deviceID}/protocols:
    get:
      operationId: listDeviceProtocols
      description: Protocol discovery for one device, with the same shape as /protocols and device_id set. Requires traffic:read. The path accepts a device ID; an unknown device returns 404 device_not_found.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: deviceID, required: true, schema: {type: string, maxLength: 256}}
        - {$ref: "#/components/parameters/ProtocolWindow"}
        - {$ref: "#/components/parameters/ProtocolCategory"}
        - {$ref: "#/components/parameters/ProtocolExotic"}
      responses:
        "200": {description: Protocol discovery summary for the device, content: {application/json: {schema: {$ref: "#/components/schemas/ProtocolSummary"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /event-query-snapshots:
    post:
      operationId: createEventQuerySnapshot
      description: Canonicalizes a traffic query, freezes relative time and friendly-name resolution, establishes an immutable ingestion watermark, and returns an actor-bound selection reference that expires in 1 to 60 minutes.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/EventQuerySnapshotInput"}}}}
      responses:
        "201": {description: Frozen traffic population, content: {application/json: {schema: {$ref: "#/components/schemas/EventQuerySnapshot"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /event-query-snapshots/{snapshotID}:
    get:
      operationId: getEventQuerySnapshot
      description: Returns an unexpired query snapshot only to the actor that created it.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/EventQuerySnapshotID"}]
      responses:
        "200": {description: Frozen traffic population, content: {application/json: {schema: {$ref: "#/components/schemas/EventQuerySnapshot"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /saved-views:
    get:
      operationId: listSavedViews
      description: Lists at most 100 personal views owned by the session actor plus visible shared views.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: scope, schema: {type: string, enum: [personal, shared]}}
        - {in: query, name: page, schema: {const: live-traffic}}
      responses:
        "200": {description: Bounded saved-view list, content: {application/json: {schema: {$ref: "#/components/schemas/SavedViewPage"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    post:
      operationId: createSavedView
      description: Canonicalizes and persists a new owned saved view at revision one.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SavedViewConfiguration"}}}}
      responses:
        "201": {description: Saved view created, content: {application/json: {schema: {$ref: "#/components/schemas/SavedView"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /saved-views/import:
    post:
      operationId: importSavedView
      description: Validates a bounded metadata-only export document and creates a new view owned by the importing actor.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SavedViewExport"}}}}
      responses:
        "201": {description: Imported view, content: {application/json: {schema: {$ref: "#/components/schemas/SavedView"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /saved-views/{viewID}:
    parameters:
      - {$ref: "#/components/parameters/SavedViewID"}
    get:
      operationId: getSavedView
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Visible saved view, content: {application/json: {schema: {$ref: "#/components/schemas/SavedView"}}}}
        "404": {$ref: "#/components/responses/Error"}
    put:
      operationId: updateSavedView
      description: Owner-only optimistic revision update that appends an immutable version snapshot.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SavedViewUpdate"}}}}
      responses:
        "200": {description: Updated saved view, content: {application/json: {schema: {$ref: "#/components/schemas/SavedView"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteSavedView
      description: Owner-only optimistic deletion of a non-destructive view configuration.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: expected_revision, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "204": {description: Saved view deleted}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /saved-views/{viewID}/duplicate:
    post:
      operationId: duplicateSavedView
      description: Copies any visible view into a new view owned by the current actor.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/SavedViewID"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [name, scope], properties: {name: {type: string, minLength: 1, maxLength: 96}, scope: {type: string, enum: [personal, shared]}}}}}
      responses:
        "201": {description: Duplicated saved view, content: {application/json: {schema: {$ref: "#/components/schemas/SavedView"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /saved-views/{viewID}/export:
    get:
      operationId: exportSavedView
      description: Exports configuration only; owner, editor, revision, and timestamps are excluded.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/SavedViewID"}]
      responses:
        "200": {description: Portable saved-view document, content: {application/json: {schema: {$ref: "#/components/schemas/SavedViewExport"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /saved-views/{viewID}/history:
    get:
      operationId: getSavedViewHistory
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/SavedViewID"}]
      responses:
        "200": {description: Newest-first immutable revision history, content: {application/json: {schema: {$ref: "#/components/schemas/SavedViewHistory"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /agent/devices:
    get:
      operationId: listAgentDevices
      description: >-
        Metadata-only device inventory for AI agents and scripts (an administrator session or devices:read).
        Omits MAC and client identities, owners and notes; keeps device IDs, display and friendly names,
        bounded address and hostname evidence, attribution, pinned_address (the IP address an administrator
        named the device by) and former_ids (device records merged into this one, e.g. earlier private MACs).
        Callers that may read traffic (a session or traffic:read) also get platform, what the device most
        likely is (e.g. GrapheneOS phone) and the connectivity check or DHCP request that showed it.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: q, schema: {type: string, maxLength: 128}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {in: query, name: online_only, schema: {type: boolean}}
      responses:
        "200": {description: Bounded device page, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /agent/devices/{deviceID}:
    get:
      operationId: getAgentDevice
      description: One device in the metadata-only agent projection (an administrator session or devices:read).
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: deviceID, required: true, schema: {type: string, pattern: "^device-[a-f0-9]{32}$"}}
      responses:
        "200": {description: The device, content: {application/json: {schema: {type: object}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /agent/http-activity:
    get:
      operationId: listAgentHTTPActivity
      description: >-
        HTTP requests ShakerProxy saw (method, scheme, host, path, status, decrypted or not) for agents and
        scripts (an administrator session or traffic:read); never headers, bodies or query strings. Windows
        up to 24 hours.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: window, schema: {type: string, enum: [5m, 15m, 1h, 6h, 24h], default: 24h}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {in: query, name: device_id, schema: {type: string, pattern: "^device-[a-f0-9]{32}$"}}
        - {in: query, name: host, schema: {type: string, maxLength: 253}}
        - {in: query, name: method, schema: {type: string, maxLength: 16}}
        - {in: query, name: cursor, schema: {type: string, maxLength: 4096}}
      responses:
        "200": {description: Bounded HTTP activity page, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /agent/system-overview:
    get:
      operationId: getAgentSystemOverview
      description: Whether ShakerProxy is ready to collect evidence (gateway mode, analyzers, ingestion, limitations) in one bounded document for agents (an administrator session or system:read).
      security: [{bearerAuth: []}]
      responses:
        "200": {description: System overview, content: {application/json: {schema: {type: object}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /agent/captures:
    get:
      operationId: listAgentCaptures
      description: >-
        Compact capture list for AI agents and scripts (an administrator session or captures:read): each
        recording's name, kind (automatic Lab traffic or VPN traffic, coverage_check, manual), state,
        interface, segments, bytes, packets and drops, hold and case. Active recordings first, then newest.
        Never returns file names, hashes, PCAP bytes or exports; GET /api/v1/captures has the full records.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200": {description: Bounded capture page, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /agent/cases:
    get:
      operationId: listAgentCases
      description: >-
        Case summaries for AI agents and scripts (an administrator session or cases:read), most recently
        updated first: name, status, evidence counts by kind, hold state and the last timeline action.
        A token restricted to some cases cannot list cases; it reads them one at a time.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200": {description: Bounded case page, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /agent/cases/{caseID}:
    get:
      operationId: getAgentCase
      description: "One case for agents (an administrator session or cases:read): its summary, the newest 50 evidence items and the newest 20 timeline events, with whether more exist."
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: caseID, required: true, schema: {type: string, pattern: "^case-[a-f0-9]{32}$"}}
      responses:
        "200": {description: Bounded case detail, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /agent-connections/investigator:
    post:
      operationId: createAgentInvestigator
      description: >-
        Creates a display-once API token for an AI agent with the fixed investigator scopes (system:read,
        devices:read, traffic:read; 24 hours). Administrator session and password only. HTTP content
        (traffic:content) is never included; create a separate token for it.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password], properties: {name: {type: string, maxLength: 64}, password: {type: string}}}}}}
      responses:
        "201": {description: The token, shown once, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /http-content-policy:
    get:
      operationId: getHTTPContentPolicy
      description: How much decrypted HTTP content (headers and body previews) ShakerProxy keeps for future decrypted requests. Administrator session only.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Current policy and its bounds, content: {application/json: {schema: {type: object}}}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    put:
      operationId: setHTTPContentPolicy
      description: Changes the decrypted HTTP content retention for future requests without disabling HTTPS decryption. Administrator session and password only.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: The applied policy, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /self-test/status:
    get:
      operationId: getSelfTestStatus
      description: State of the virtual test lab (disposable network namespaces that act as test clients). Administrator session only.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Test lab state, content: {application/json: {schema: {type: object}}}}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /self-test/run:
    post:
      operationId: runSelfTest
      description: Creates the virtual test lab and runs its routing and protocol checks. Administrator session and password only.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: The run, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /self-test/cleanup:
    post:
      operationId: cleanupSelfTest
      description: Removes the virtual test lab's namespaces and rules. Administrator session and password only.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: Cleanup result, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, description: Browser sessions authenticate every route. Expiring scoped API tokens authenticate only explicitly scoped read/automation routes and cannot manage credentials, forwarders, networking, deletion, exports, rules, or trust material.}
  responses:
    Error:
      description: Structured error response
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: {type: string, pattern: "^[a-z0-9_]+$"}
                  message: {type: string, description: What went wrong and what to do next.}
  parameters:
    CaptureSessionID:
      in: path
      name: sessionID
      required: true
      schema: {type: string, pattern: "^capture-[a-f0-9]{32}$"}
    TestSessionID:
      in: path
      name: sessionID
      required: true
      schema: {type: string, pattern: "^ts-[a-f0-9]{24}$"}
    SavedViewID:
      in: path
      name: viewID
      required: true
      schema: {type: string, pattern: "^view-[a-f0-9]{32}$"}
    EventQuerySnapshotID:
      in: path
      name: snapshotID
      required: true
      schema: {type: string, pattern: "^qsnap-[a-f0-9]{32}$"}
    CaseID:
      in: path
      name: caseID
      required: true
      schema: {type: string, pattern: "^case-[a-f0-9]{32}$"}
    APITokenID:
      in: path
      name: tokenID
      required: true
      schema: {type: string, pattern: "^tok_[a-f0-9]{24}$"}
    ForwarderID:
      in: path
      name: forwarderID
      required: true
      schema: {type: string, pattern: "^fwd_[a-f0-9]{24}$"}
    ProtocolWindow:
      in: query
      name: window
      schema: {type: string, enum: [1h, 24h, 7d, 30d], default: 24h}
    ProtocolCategory:
      in: query
      name: category
      description: Keep only protocols in this catalog category; coverage still describes every protocol in scope.
      schema: {type: string, maxLength: 64}
    ProtocolExotic:
      in: query
      name: exotic
      description: true keeps only exotic protocols, false only mainstream ones.
      schema: {type: boolean}
  schemas:
    CoverageFinding:
      type: object
      required: [id, title, status, detail]
      properties:
        id: {type: string}
        title: {type: string}
        status: {type: string, enum: [GAP, OK, UNKNOWN]}
        detail: {type: string}
        fix: {type: string}
    CoverageResult:
      type: object
      required: [id, name, category, status, summary, event_kinds, attributed]
      properties:
        id: {type: string, description: "dns-gateway, dns-direct, dot, doh, doq, http, https, quic, tcp-unusual-port, udp-unusual-port, icmp, ssh, ntp, mdns, ssdp or ipv6"}
        name: {type: string}
        category: {type: string}
        status: {type: string, enum: [PASS, FAIL, SKIP]}
        summary: {type: string}
        event_kinds: {type: array, items: {type: string}}
        latency_ms: {type: integer, minimum: 0, description: Time from sending the probe to the first stored event.}
        attributed: {type: boolean}
        missing: {type: string}
        app_protocol: {type: string}
    CoverageReport:
      type: object
      required: [schema, run_id, state, started_at, results, routing, pass_count, fail_count, skip_count, gap_count, limitations]
      properties:
        schema: {const: 1}
        run_id: {type: string, pattern: "^coverage-[a-f0-9]{24}$"}
        state: {type: string, enum: [RUNNING, COMPLETED, FAILED]}
        phase: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        capture_session_id: {type: string}
        results: {type: array, maxItems: 64, items: {$ref: "#/components/schemas/CoverageResult"}}
        routing: {type: array, maxItems: 32, items: {$ref: "#/components/schemas/CoverageFinding"}}
        pass_count: {type: integer, minimum: 0}
        fail_count: {type: integer, minimum: 0}
        skip_count: {type: integer, minimum: 0}
        gap_count: {type: integer, minimum: 0}
        error: {type: string}
        limitations: {type: array, items: {type: string}}
    APITokenScope:
      type: string
      enum: ["system:read", "devices:read", "traffic:read", "captures:read", "captures:write", "cases:read", "cases:write", "metrics:read", "lab:write"]
      description: "lab:write runs lab actions on devices (test sessions, device controls, CA trust state) and is not sensitive. captures:write and cases:write are sensitive."
    APITokenRestrictions:
      type: object
      additionalProperties: false
      properties:
        device_ids: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, pattern: "^device-[a-f0-9]{32}$"}}
        case_ids: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, pattern: "^case-[a-f0-9]{32}$"}}
    CreateAPITokenRequest:
      type: object
      additionalProperties: false
      required: [name, scopes, expires_in_seconds, password]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        scopes: {type: array, minItems: 1, maxItems: 9, uniqueItems: true, items: {$ref: "#/components/schemas/APITokenScope"}}
        restrictions: {$ref: "#/components/schemas/APITokenRestrictions"}
        expires_in_seconds: {type: integer, format: int64, minimum: 300, maximum: 7776000}
        sensitive_scope_acknowledged: {type: boolean, default: false, description: "Must be true when captures:write or cases:write is requested."}
        password: {type: string, minLength: 1, maxLength: 1024}
    RevokeAPITokenRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        password: {type: string, minLength: 1, maxLength: 1024}
        reason: {type: string, minLength: 3, maxLength: 256}
    APIToken:
      type: object
      additionalProperties: false
      required: [id, name, creator, scopes, created_at, expires_at, use_count, state]
      properties:
        id: {type: string, pattern: "^tok_[a-f0-9]{24}$"}
        name: {type: string, minLength: 1, maxLength: 64}
        creator: {type: string, minLength: 1, maxLength: 128}
        scopes: {type: array, minItems: 1, maxItems: 9, items: {$ref: "#/components/schemas/APITokenScope"}}
        restrictions: {$ref: "#/components/schemas/APITokenRestrictions"}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        use_count: {type: integer, format: int64, minimum: 0}
        sensitive_approved: {type: boolean}
        state: {type: string, enum: [active, expired, revoked]}
    CreatedAPIToken:
      type: object
      additionalProperties: false
      required: [token, secret]
      properties:
        token: {$ref: "#/components/schemas/APIToken"}
        secret: {type: string, minLength: 40, maxLength: 128, writeOnly: true, description: Display-once bearer credential. Never persisted in cleartext.}
    ForwarderEventClass:
      type: string
      enum: [ALERT, AUDIT, DEVICE_LIFECYCLE, DNS_ENFORCEMENT, NETWORK_OBSERVATION, SERVICE_HEALTH]
    CreateForwarderRequest:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        kind: {type: string, enum: [JSONL, WEBHOOK, SYSLOG_TLS]}
        destination: {type: string, maxLength: 2048, description: "Empty for fixed local JSONL; public https:// URL on 443 for webhooks; tls://host:6514 for syslog."}
        classes: {type: array, maxItems: 6, uniqueItems: true, items: {$ref: "#/components/schemas/ForwarderEventClass"}}
        password: {type: string, minLength: 1, maxLength: 1024}
    PutSyslogCollectorRequest:
      type: object
      additionalProperties: false
      required: [enabled, allowed_sources, password]
      properties:
        enabled: {type: boolean}
        bind_address: {type: string, maxLength: 64, description: "host:port to listen on; default :1514"}
        tcp: {type: boolean}
        udp: {type: boolean, description: "UDP is spoofable; prefer TCP"}
        allowed_sources: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, maxLength: 45, description: "device IP to accept logs from (the router's address)"}}
        expected_revision: {type: integer, minimum: 0}
        password: {type: string, minLength: 1, maxLength: 1024}
    SyslogCollector:
      type: object
      additionalProperties: false
      required: [available, enabled, bind_address, tcp, udp, allowed_sources, revision, setup]
      properties:
        available: {const: true}
        enabled: {type: boolean}
        bind_address: {type: string, maxLength: 64}
        tcp: {type: boolean}
        udp: {type: boolean}
        allowed_sources: {type: array, maxItems: 64, items: {type: string, maxLength: 45}}
        revision: {type: integer, minimum: 0}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string, maxLength: 256}
        setup: {type: string, maxLength: 512}
        status:
          type: object
          description: "Receiver counts and per-source liveness; never log content."
          additionalProperties: true
    SetForwarderEnabledRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        expected_revision: {type: integer, minimum: 0}
        enabled: {type: boolean}
        reason: {type: string, minLength: 3, maxLength: 256}
        password: {type: string, minLength: 1, maxLength: 1024}
    UpdateForwarderRequest:
      type: object
      additionalProperties: false
      properties:
        expected_revision: {type: integer, minimum: 0}
        name: {type: string, minLength: 1, maxLength: 64}
        destination: {type: string, maxLength: 2048}
        classes: {type: array, minItems: 1, maxItems: 6, uniqueItems: true, items: {$ref: "#/components/schemas/ForwarderEventClass"}}
        reason: {type: string, maxLength: 256}
        password: {type: string, maxLength: 1024}
    DeleteForwarderRequest:
      type: object
      additionalProperties: false
      properties:
        expected_revision: {type: integer, minimum: 0}
        reason: {type: string, maxLength: 256}
        password: {type: string, maxLength: 1024}
    ForwarderIntegration:
      type: object
      additionalProperties: false
      required: [id, revision, name, kind, destination, classes, enabled, created_by, created_at, updated_at]
      properties:
        id: {type: string, pattern: "^fwd_[a-f0-9]{24}$"}
        revision: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 64}
        kind: {type: string, enum: [JSONL, WEBHOOK, SYSLOG_TLS]}
        destination: {type: string, minLength: 1, maxLength: 2048}
        classes: {type: array, minItems: 1, maxItems: 6, items: {$ref: "#/components/schemas/ForwarderEventClass"}}
        enabled: {type: boolean}
        created_by: {type: string, minLength: 1, maxLength: 128}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CreatedForwarder:
      type: object
      additionalProperties: false
      required: [integration]
      properties:
        integration: {$ref: "#/components/schemas/ForwarderIntegration"}
        hmac_secret: {type: string, minLength: 40, maxLength: 128, writeOnly: true, description: Display-once webhook signing secret.}
    CreateCaseRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 96}
        description: {type: string, maxLength: 2048, description: Newlines and tabs are allowed.}
        reason: {type: string, maxLength: 512}
    UpdateCaseRequest:
      type: object
      additionalProperties: false
      properties:
        expected_revision: {type: integer, minimum: 0}
        name: {type: string, minLength: 1, maxLength: 96}
        description: {type: string, maxLength: 2048, description: Newlines and tabs are allowed.}
        reason: {type: string, maxLength: 512}
    AddCaseEvidenceRequest:
      type: object
      additionalProperties: false
      required: [kind, artifact_id]
      properties:
        expected_revision: {type: integer, minimum: 0}
        kind: {type: string, enum: [CAPTURE, CAPTURE_EXPORT, QUERY_SNAPSHOT]}
        artifact_id: {type: string, pattern: "^(capture|export|qsnap)-[a-f0-9]{32}$"}
        label: {type: string, maxLength: 256}
        reason: {type: string, maxLength: 512}
    SetCaseHoldRequest:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        expected_revision: {type: integer, minimum: 0}
        active: {type: boolean}
        reason: {type: string, minLength: 1, maxLength: 512}
        password: {type: string, minLength: 1, maxLength: 1024}
    SetCaseStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        expected_revision: {type: integer, minimum: 0}
        status: {type: string, enum: [OPEN, CLOSED]}
        reason: {type: string, minLength: 1, maxLength: 512}
        password: {type: string, minLength: 1, maxLength: 1024}
    Case:
      type: object
      additionalProperties: false
      required: [schema, id, revision, name, status, created_by, created_at, updated_at, evidence, hold, timeline]
      properties:
        schema: {const: 1}
        id: {type: string, pattern: "^case-[a-f0-9]{32}$"}
        revision: {type: integer, minimum: 1, maximum: 2048}
        name: {type: string, minLength: 1, maxLength: 96}
        description: {type: string, maxLength: 2048}
        status: {type: string, enum: [OPEN, CLOSED]}
        created_by: {type: string, minLength: 1, maxLength: 96}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        evidence: {type: array, maxItems: 1024, items: {$ref: "#/components/schemas/CaseEvidence"}}
        hold: {$ref: "#/components/schemas/CaseHold"}
        timeline: {type: array, minItems: 1, maxItems: 2048, items: {$ref: "#/components/schemas/CaseTimelineEvent"}}
    CaseEvidence:
      type: object
      additionalProperties: false
      required: [id, kind, artifact_id, label, added_by, added_at]
      properties:
        id: {type: string, pattern: "^evidence-[a-f0-9]{32}$"}
        kind: {type: string, enum: [CAPTURE, QUERY_SNAPSHOT, CAPTURE_EXPORT]}
        artifact_id: {type: string, pattern: "^(capture|qsnap|export)-[a-f0-9]{32}$"}
        label: {type: string, minLength: 1, maxLength: 256}
        added_by: {type: string, minLength: 1, maxLength: 96}
        added_at: {type: string, format: date-time}
        query: {$ref: "#/components/schemas/CaseQuerySnapshotPin"}
    CaseQuerySnapshotPin:
      type: object
      additionalProperties: false
      description: Durable part of a QUERY_SNAPSHOT. Re-running canonical_query over records at or below dataset_watermark reproduces the evidence, except for records later removed by retention or deletion jobs.
      required: [canonical_query, matched_count, count_relation, snapshot_created_at, snapshot_sha256, dataset_watermark]
      properties:
        canonical_query: {type: string, maxLength: 2048}
        query_anchor: {type: string, format: date-time}
        matched_count: {type: integer, minimum: 0}
        count_relation: {type: string, enum: [eq, gte]}
        snapshot_created_at: {type: string, format: date-time}
        snapshot_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        dataset_watermark:
          type: object
          additionalProperties: false
          required: [ingest_sequence, received_at, record_id]
          properties:
            ingest_sequence: {type: integer, minimum: 0}
            received_at: {type: string, format: date-time}
            record_id: {type: string, pattern: "^[a-f0-9]{64}$"}
    CaseHold:
      type: object
      additionalProperties: false
      required: [state, desired_active, results]
      properties:
        state: {type: string, enum: [INACTIVE, ACTIVE, PARTIAL]}
        desired_active: {type: boolean}
        reason: {type: string, minLength: 1, maxLength: 512}
        actor: {type: string, minLength: 1, maxLength: 96}
        operation_id: {type: string, minLength: 16, maxLength: 128, pattern: "^[!-~]{16,128}$"}
        updated_at: {type: string, format: date-time}
        results: {type: array, maxItems: 1024, items: {$ref: "#/components/schemas/CaseHoldResult"}}
    CaseHoldResult:
      type: object
      additionalProperties: false
      required: [evidence_id, artifact_id, protected]
      properties:
        evidence_id: {type: string, pattern: "^evidence-[a-f0-9]{32}$"}
        artifact_id: {type: string, pattern: "^capture-[a-f0-9]{32}$"}
        protected: {type: boolean}
        revision: {type: integer, minimum: 1}
        failure: {type: string, minLength: 1, maxLength: 256}
    CaseTimelineEvent:
      type: object
      additionalProperties: false
      required: [revision, action, actor, reason, occurred_at, sha256]
      properties:
        revision: {type: integer, minimum: 1, maximum: 2048}
        action: {type: string, enum: [CASE_CREATED, EVIDENCE_ADDED, HOLD_APPLIED, HOLD_RELEASED, HOLD_PARTIAL, CASE_OPEN, CASE_CLOSED]}
        actor: {type: string, minLength: 1, maxLength: 96}
        reason: {type: string, minLength: 1, maxLength: 512}
        occurred_at: {type: string, format: date-time}
        previous_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
    ManagementPKIStatus:
      type: object
      additionalProperties: false
      required: [schema, purpose, authority, subject, serial, sha256_fingerprint, not_before, not_after, leaf_not_after, interception_ca_state]
      properties:
        schema: {const: 1}
        purpose: {const: shakerproxy-management-tls}
        authority: {const: management-only}
        subject: {type: string}
        serial: {type: string, pattern: "^[0-9a-f]+$"}
        sha256_fingerprint: {type: string, pattern: "^([0-9A-F]{2}:){31}[0-9A-F]{2}$"}
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time}
        leaf_not_after: {type: string, format: date-time}
        interception_ca_state: {const: separate-authority}
    CapabilityBundle:
      type: object
      additionalProperties: false
      required: [schema, revision, features, glossary, support_matrix]
      properties:
        schema: {const: 1}
        revision: {type: string, minLength: 1, maxLength: 64}
        features:
          type: array
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [id, name, status, badge, summary, owning_document, evidence, promotion_gate, enabled_by_default]
            properties:
              id: {type: string, pattern: "^[a-z][a-z0-9_-]+$"}
              name: {type: string, minLength: 1, maxLength: 128}
              status: {type: string, enum: [supported, experimental, capture-only, unavailable]}
              badge: {type: string, enum: [SUPPORTED, EXPERIMENTAL, CAPTURE-ONLY, UNAVAILABLE]}
              summary: {type: string, minLength: 1, maxLength: 512}
              owning_document: {type: string, minLength: 1, maxLength: 256}
              evidence: {type: array, minItems: 1, maxItems: 32, items: {type: string, minLength: 1, maxLength: 256}}
              promotion_gate: {type: string, minLength: 1, maxLength: 512}
              enabled_by_default: {type: boolean}
        glossary:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [id, label, definition]
            properties:
              id: {type: string, pattern: "^[a-z][a-z0-9-]+$"}
              label: {type: string, minLength: 1, maxLength: 96}
              definition: {type: string, minLength: 1, maxLength: 512}
        support_matrix: {type: object}
    RecoveryObjectiveRegistry:
      type: object
      additionalProperties: false
      required: [schema, revision, statuses, objectives]
      properties:
        schema: {const: 1}
        revision: {type: string, minLength: 1, maxLength: 64}
        statuses: {type: array, minItems: 3, maxItems: 3, uniqueItems: true, items: {type: string, enum: [verified, target, not-offered]}}
        objectives:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: "#/components/schemas/RecoveryObjective"}
    RecoveryObjective:
      type: object
      additionalProperties: false
      required: [id, name, status, environment, scope, data_loss_contract, evidence, limitations]
      properties:
        id: {type: string, pattern: "^[a-z][a-z0-9-]{2,95}$"}
        name: {type: string, minLength: 1, maxLength: 128}
        status: {type: string, enum: [verified, target, not-offered]}
        environment: {type: string, minLength: 1, maxLength: 128}
        scope: {type: string, minLength: 1, maxLength: 1024}
        rto_seconds: {type: integer, minimum: 1, maximum: 604800}
        rpo_seconds: {type: integer, minimum: 0, maximum: 604800}
        data_loss_contract: {type: string, minLength: 1, maxLength: 1024}
        evidence: {type: array, minItems: 1, maxItems: 16, items: {type: string, minLength: 1, maxLength: 256}}
        limitations: {type: array, minItems: 1, maxItems: 16, items: {type: string, minLength: 1, maxLength: 512}}
    AnalyzerStatusReport:
      type: object
      additionalProperties: false
      required: [schema, generated_at, analyzers]
      properties:
        schema: {const: 1}
        generated_at: {type: string, format: date-time}
        analyzers: {type: array, minItems: 2, maxItems: 2, items: {$ref: "#/components/schemas/AnalyzerStatusEntry"}}
    AnalyzerStatusEntry:
      type: object
      additionalProperties: false
      required: [engine, available]
      properties:
        engine: {type: string, enum: [ZEEK, SURICATA]}
        available: {type: boolean}
        health: {$ref: "#/components/schemas/AnalyzerHealthSnapshot"}
        failure: {type: string, minLength: 1, maxLength: 128}
    AnalyzerHealthSnapshot:
      type: object
      additionalProperties: false
      required: [schema, engine, state, healthy, source_version, scan_in_progress, completed_captures, delivered_events, heartbeat_at, heartbeat_age_millis, checked_at]
      properties:
        schema: {const: 1}
        engine: {type: string, enum: [ZEEK, SURICATA]}
        state: {type: string, enum: [HEALTHY, SCANNING, STALE]}
        healthy: {type: boolean}
        source_version: {type: string, minLength: 1, maxLength: 64}
        ruleset_id: {type: string, pattern: "^[a-z0-9][a-z0-9-]{2,63}$"}
        ruleset_version: {type: string, pattern: "^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}\\.[1-9][0-9]{0,5}$"}
        ruleset_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        scan_in_progress: {type: boolean}
        completed_captures: {type: integer, minimum: 0}
        delivered_events: {type: integer, minimum: 0}
        last_scan_at: {type: string, format: date-time}
        last_success_at: {type: string, format: date-time}
        heartbeat_at: {type: string, format: date-time}
        heartbeat_age_millis: {type: integer}
        last_error: {type: string, maxLength: 2048}
        checked_at: {type: string, format: date-time}
    DiagnosticReport:
      type: object
      additionalProperties: false
      required: [schema, generated_at, overall, checks, resource_pressure]
      properties:
        schema: {const: 1}
        generated_at: {type: string, format: date-time}
        overall: {type: string, enum: [PASS, WARNING, FAIL, UNKNOWN]}
        checks:
          type: array
          minItems: 14
          maxItems: 14
          items: {$ref: "#/components/schemas/DiagnosticCheck"}
        resource_pressure: {$ref: "#/components/schemas/ResourcePressure"}
    ResourcePressure:
      type: object
      additionalProperties: false
      required: [schema, generated_at, level, causes, actions, new_capture_allowed]
      properties:
        schema: {const: 1}
        generated_at: {type: string, format: date-time}
        level: {type: string, enum: [NORMAL, DEGRADED, CRITICAL, UNKNOWN]}
        cpu_stall_percent: {type: number, minimum: 0, maximum: 100}
        memory_available_percent: {type: number, minimum: 0, maximum: 100}
        disk_available_bytes: {type: integer, minimum: 0}
        causes: {type: array, maxItems: 3, items: {type: string, maxLength: 64}}
        actions: {type: array, minItems: 1, maxItems: 4, items: {type: string, maxLength: 64}}
        new_capture_allowed: {type: boolean}
    DiagnosticCheck:
      type: object
      additionalProperties: false
      required: [name, status, summary, observations]
      properties:
        name: {type: string, enum: [interfaces, firewall, routes, dns, forwarding, dhcp, docker, services, service_ports, disk, resource_pressure, time_sync, capture, packet_drops]}
        status: {type: string, enum: [PASS, WARNING, FAIL, UNKNOWN]}
        summary: {type: string, minLength: 1, maxLength: 256}
        observations: {type: array, maxItems: 8, items: {type: string, maxLength: 256}}
    PortListener:
      type: object
      additionalProperties: false
      required: [transport, address, port]
      properties:
        transport: {type: string, enum: [tcp, udp]}
        address: {type: string, minLength: 1, maxLength: 64}
        port: {type: integer, minimum: 1, maximum: 65535}
        process: {type: string, minLength: 1, maxLength: 64}
    PortReservation:
      type: object
      additionalProperties: false
      required: [transport, port, purpose, intended_binding, state, action, listeners]
      properties:
        transport: {type: string, enum: [tcp, udp]}
        port: {type: integer, enum: [53, 443, 853, 8443]}
        purpose: {type: string, minLength: 1, maxLength: 128}
        intended_binding: {type: string, minLength: 1, maxLength: 64}
        state: {type: string, enum: [FREE, COEXIST, OWNED_EXPECTED, POTENTIAL_CONFLICT]}
        action: {type: string, enum: [AVAILABLE, PRESERVE_STUB_BIND_LAB_ADDRESS_ONLY, PRESERVE_SHAKERPROXY_OWNER, REVIEW_OR_REBIND_BEFORE_ENABLE]}
        listeners: {type: array, maxItems: 4096, items: {$ref: "#/components/schemas/PortListener"}}
    ServicePortPlan:
      type: object
      additionalProperties: false
      required: [schema, generated_at, systemd_resolved_stub, resolver_handling, reservations]
      properties:
        schema: {const: 1}
        generated_at: {type: string, format: date-time}
        systemd_resolved_stub: {type: boolean}
        resolver_handling: {type: string, enum: [NO_STUB_DETECTED, PRESERVE_STUB_BIND_LAB_ADDRESS_ONLY]}
        reservations: {type: array, minItems: 7, maxItems: 7, items: {$ref: "#/components/schemas/PortReservation"}}
    ConnectivityProbe:
      type: object
      additionalProperties: false
      required: [name, target, status, detail]
      properties:
        name: {type: string, enum: [dns-independent-https-ipv4, plain-dns-tcp-ipv4]}
        target: {type: string, enum: ["1.1.1.1:443", "1.1.1.1:53"]}
        status: {type: string, enum: [PASS, FAIL, UNKNOWN]}
        latency_millis: {type: integer, minimum: 0, maximum: 7000}
        detail: {type: string, maxLength: 160}
    ConnectivityReport:
      type: object
      additionalProperties: false
      required: [schema, generated_at, dns_independent_https, plain_dns_port_53, restricted_port_53, probes]
      properties:
        schema: {const: 1}
        generated_at: {type: string, format: date-time}
        dns_independent_https: {type: boolean}
        plain_dns_port_53: {type: boolean}
        restricted_port_53: {type: boolean, description: True only when fixed-IP HTTPS succeeds and fixed-IP TCP/53 fails.}
        probes: {type: array, minItems: 2, maxItems: 2, items: {$ref: "#/components/schemas/ConnectivityProbe"}}
    EncryptedDNSPolicy:
      type: object
      additionalProperties: false
      required: [mode, block_dot, block_doq, block_known_doh, block_known_doh3, redirect_plain_dns, local_listen_port, upstream_servers]
      properties:
        mode: {type: string, enum: [OBSERVE, BLOCK_KNOWN, ENFORCE_LOCAL]}
        block_dot: {type: boolean}
        block_doq: {type: boolean}
        block_known_doh: {type: boolean}
        block_known_doh3: {type: boolean}
        redirect_plain_dns: {type: boolean, description: Required when mode is ENFORCE_LOCAL.}
        local_listen_port: {type: integer, minimum: 1024, maximum: 65535, default: 1053}
        upstream_servers: {type: array, maxItems: 16, uniqueItems: true, items: {type: string, minLength: 4, maxLength: 64, description: "Canonical IPv4-or-bracketed-IPv6 IP:53 endpoint; hostnames are rejected."}}
        resolver_exclusions: {type: array, maxItems: 512, uniqueItems: true, items: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$"}}
    TLSInterceptionPolicy:
      type: object
      additionalProperties: false
      required: [enabled, transparent_port, auto_bypass_pinned, auto_bypass_ttl_seconds, max_dynamic_bypasses]
      properties:
        enabled: {type: boolean}
        transparent_port: {type: integer, minimum: 1024, maximum: 65535, default: 8085}
        exclude_hosts: {type: array, maxItems: 512, uniqueItems: true, items: {type: string, maxLength: 253}}
        exclude_cidrs: {type: array, maxItems: 512, uniqueItems: true, items: {type: string, maxLength: 64}}
        auto_bypass_pinned: {type: boolean}
        auto_bypass_ttl_seconds: {type: integer, minimum: 300, maximum: 2592000}
        max_dynamic_bypasses: {type: integer, minimum: 16, maximum: 10000}
        mobile_clients:
          type: array
          maxItems: 512
          items:
            type: object
            additionalProperties: false
            required: [cidr, platform]
            properties:
              cidr: {type: string, maxLength: 18, description: Canonical IPv4 CIDR such as 192.0.2.40/32.}
              platform: {type: string, enum: [android, android-tv, ios, tvos]}
        selected_device_ids: {type: array, maxItems: 512, uniqueItems: true, items: {type: string, pattern: "^device-[a-f0-9]{32}$"}, description: Empty means every lab client; otherwise only these devices are decrypted.}
        allow_quic: {type: boolean, default: false, description: "Keep UDP/443 open for decrypted clients. By default QUIC is rejected so HTTP/3 apps fall back to decryptable TCP."}
        intercept_http: {type: boolean, default: false, description: Also record plain HTTP (TCP/80) from decrypted clients.}
        intercept_private_destinations: {type: boolean, default: false, description: "Also decrypt connections to RFC 1918, CGNAT, link-local and ULA destinations (off by default: LAN and IoT backends often use self-signed or mutual TLS)."}
    InterceptionCAStatus:
      type: object
      additionalProperties: false
      required: [schema_version, purpose, common_name, sha256_fingerprint, serial, not_before, not_after, pem_path, der_path, private_key_export]
      properties:
        schema_version: {const: 1}
        purpose: {const: tls-interception}
        common_name: {type: string, minLength: 1, maxLength: 128}
        sha256_fingerprint: {type: string, pattern: "^[a-f0-9]{64}$"}
        serial: {type: string, minLength: 1, maxLength: 64}
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time}
        pem_path: {type: string}
        der_path: {type: string}
        private_key_export: {const: false}
    InterceptionCAResponse:
      type: object
      additionalProperties: false
      required: [status, download_pem, download_der, private_key_downloadable]
      properties:
        status: {$ref: "#/components/schemas/InterceptionCAStatus"}
        download_pem: {type: string, const: "/api/v1/interception-ca/download?format=pem"}
        download_der: {type: string, const: "/api/v1/interception-ca/download?format=der"}
        onboarding: {type: string, const: "/api/v1/interception-ca/onboarding"}
        private_key_downloadable: {const: false}
    InterceptionCAOnboarding:
      type: object
      additionalProperties: false
      required: [schema, available, reason, sha256_fingerprint, common_name, not_after, urls, instructions]
      properties:
        schema: {const: 1}
        available: {type: boolean, description: True when lab devices can open the onboarding page now.}
        reason: {type: string, description: Empty when available; otherwise what to do next.}
        sha256_fingerprint: {type: string, description: "Upper-case colon-separated SHA-256, empty when no CA exists."}
        common_name: {type: string}
        not_after: {type: string, description: RFC 3339 expiry, empty when no CA exists.}
        urls:
          type: array
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [label, url]
            properties:
              label: {type: string}
              url: {type: string}
        instructions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [platform, title, steps, limitations]
            properties:
              platform: {type: string, enum: [ios, android, android-tv, macos, windows, linux, smart-tv, other]}
              title: {type: string}
              steps: {type: array, items: {type: string}}
              limitations: {type: array, items: {type: string}}
    DeviceControls:
      type: object
      additionalProperties: false
      required: [schema, device_id, decrypt_https, internet, blocked_domains, updated_at, effective, notes]
      properties:
        schema: {const: 1}
        device_id: {type: string, pattern: "^device-[a-f0-9]{32}$"}
        decrypt_https: {type: boolean}
        internet: {type: string, enum: [ALLOW, BLOCK]}
        blocked_domains: {type: array, maxItems: 256, items: {type: string, maxLength: 253}}
        updated_at: {type: string, format: date-time, description: When the traffic policy was last applied.}
        effective: {type: boolean, description: False when the controls are saved but not enforced right now; notes say why.}
        notes: {type: array, items: {type: string}}
    DeviceControlsUpdate:
      type: object
      additionalProperties: false
      properties:
        decrypt_https: {type: boolean}
        internet: {type: string, enum: [ALLOW, BLOCK], description: Case-insensitive.}
        blocked_domains: {type: array, maxItems: 256, items: {type: string, maxLength: 255}, description: "Names such as example.com; *.example.com and trailing dots are accepted. Subdomains are always included."}
    TLSBypassRequest:
      type: object
      additionalProperties: false
      required: [host]
      properties:
        host: {type: string, maxLength: 253}
        device: {type: string, maxLength: 256, description: Device ID, MAC, IP or friendly name; omit to bypass for every device.}
    TLSBypassResult:
      type: object
      additionalProperties: false
      required: [schema, host, device_id, scope, revision, notes]
      properties:
        schema: {const: 1}
        host: {type: string}
        device_id: {type: [string, "null"]}
        scope: {type: string, enum: [device, all_devices]}
        removed: {type: boolean}
        revision: {type: integer, minimum: 1}
        notes: {type: array, items: {type: string}}
    TrafficDeviceControl:
      type: object
      additionalProperties: false
      required: [device_id]
      properties:
        device_id: {type: string, pattern: "^device-[a-f0-9]{32}$"}
        hardware_addresses: {type: array, maxItems: 8, items: {type: string, pattern: "^[0-9a-f]{2}(:[0-9a-f]{2}){5}$"}, description: Identity evidence captured from the inventory.}
        addresses: {type: array, maxItems: 16, items: {type: string, maxLength: 64}}
        block_internet: {type: boolean}
        blocked_domains: {type: array, maxItems: 256, items: {type: string, maxLength: 253}}
        bypass_hosts: {type: array, maxItems: 256, items: {type: string, maxLength: 253}}
    TrafficPolicy:
      type: object
      additionalProperties: false
      required: [schema, revision, name, encrypted_dns, tls_interception]
      properties:
        schema: {const: 1}
        revision: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 120}
        encrypted_dns: {$ref: "#/components/schemas/EncryptedDNSPolicy"}
        tls_interception: {$ref: "#/components/schemas/TLSInterceptionPolicy"}
        device_controls: {type: array, maxItems: 512, items: {$ref: "#/components/schemas/TrafficDeviceControl"}, description: "Per-device lab controls, normally managed with /devices/{device}/controls. A PUT without this field keeps the saved controls; an empty list clears them."}
    VPNStatus:
      type: object
      additionalProperties: false
      required: [schema, revision, enabled, up, interface, listen_port, server_public_key, ipv4_cidr, gateway_ipv4, ipv6_prefix, gateway_ipv6, ipv6_routed, allow_peer_to_peer, peers, notes]
      properties:
        schema: {const: 1}
        revision: {type: integer, minimum: 0}
        enabled: {type: boolean}
        up: {type: boolean, description: The WireGuard interface is running as configured.}
        interface: {type: string, examples: [wg-lab]}
        listen_port: {type: integer}
        endpoint: {type: string, description: "What device configurations dial (host:port)."}
        endpoint_setting: {type: string, description: The administrator's override; empty uses default_endpoint_host and listen_port.}
        default_endpoint_host: {type: string}
        server_public_key: {type: string}
        ipv4_cidr: {type: string}
        gateway_ipv4: {type: string, description: ShakerProxy on the VPN; devices use it for DNS.}
        ipv6_prefix: {type: string}
        gateway_ipv6: {type: string}
        ipv6_routed: {type: boolean, description: "VPN devices reach IPv6 sites (NAT66). Otherwise IPv6 stays inside the tunnel and devices use IPv4."}
        allow_peer_to_peer: {type: boolean}
        peers: {type: array, items: {$ref: "#/components/schemas/VPNDevice"}}
        problem: {type: string, description: Why an enabled VPN is not up.}
        notes: {type: array, items: {type: string}}
    VPNDevice:
      type: object
      additionalProperties: false
      required: [id, name, public_key, ipv4, ipv6, created_at, connected, received_bytes, sent_bytes]
      properties:
        id: {type: string, pattern: "^vpn-[a-f0-9]{16}$"}
        name: {type: string}
        device_id: {type: string, description: The device in Devices named by this VPN address.}
        public_key: {type: string}
        ipv4: {type: string}
        ipv6: {type: string}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        connected: {type: boolean, description: A handshake within the last three minutes.}
        last_handshake: {type: string, format: date-time}
        remote_address: {type: string, description: Where the device last connected from.}
        received_bytes: {type: integer, minimum: 0}
        sent_bytes: {type: integer, minimum: 0}
    VPNDeviceConfig:
      type: object
      additionalProperties: false
      required: [peer, config, file_name, device_name, warnings]
      properties:
        peer: {$ref: "#/components/schemas/VPNDevice"}
        config: {type: string, description: "wg-quick configuration: full tunnel (AllowedIPs 0.0.0.0/0, ::/0) with DNS set to ShakerProxy's VPN address. Show it as a QR code for the WireGuard app or save it as file_name."}
        file_name: {type: string}
        device_id: {type: string}
        device_name: {type: string}
        warnings: {type: array, items: {type: string}}
    DNSVisibility:
      type: object
      additionalProperties: false
      required: [schema, policy_revision, force_plain_dns, block_encrypted_dns, mode, upstream_servers, blocked_resolvers, blocked_addresses, blocked_names, canaries, notes]
      properties:
        schema: {const: 1}
        policy_revision: {type: integer, minimum: 1}
        force_plain_dns: {type: boolean}
        block_encrypted_dns: {type: boolean}
        mode: {type: string, enum: [OBSERVE, BLOCK_KNOWN, ENFORCE_LOCAL], description: Effective traffic-policy mode the switches produce.}
        upstream_servers: {type: array, items: {type: string}, description: Empty means this host's own DNS servers.}
        blocked_resolvers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, provider, hostnames, ipv4, ipv6]
            properties:
              id: {type: string}
              provider: {type: string}
              hostnames: {type: array, items: {type: string}}
              ipv4: {type: array, items: {type: string}}
              ipv6: {type: array, items: {type: string}}
        blocked_addresses: {type: integer, minimum: 0}
        blocked_names: {type: array, maxItems: 512, items: {type: string}, description: Answered with NXDOMAIN while block_encrypted_dns is on; each also covers its subdomains.}
        canaries: {type: array, items: {type: string}}
        notes: {type: array, items: {type: string}}
    WiFiVisibility:
      type: object
      additionalProperties: false
      required: [schema, settings, available, active, shared_with_access_point, capturing, worker_running, lab_devices, adapters, nearby_retention_hours, checked_at, notes]
      properties:
        schema: {const: 1}
        settings:
          type: object
          additionalProperties: false
          required: [enabled, channel_mode, nearby]
          properties:
            enabled: {type: boolean}
            adapter: {type: string, maxLength: 15}
            channel_mode: {type: string, enum: [auto, fixed, hop]}
            channel: {type: integer, minimum: 1, maximum: 177}
            nearby: {type: boolean}
        available: {type: boolean, description: An adapter can listen; reason says why not.}
        reason: {type: string, maxLength: 512}
        active: {type: boolean}
        interface: {type: string, maxLength: 15}
        adapter: {type: string, maxLength: 15}
        phy: {type: string, maxLength: 16}
        shared_with_access_point: {type: boolean}
        channel_mode: {type: string, enum: [fixed, hop, access-point]}
        channel: {type: integer, minimum: 1, maximum: 233}
        frequency_mhz: {type: integer, minimum: 2412, maximum: 7115}
        hop_channels: {type: array, maxItems: 24, items: {type: integer}}
        capturing: {type: boolean}
        worker_running: {type: boolean}
        lab_ssid: {type: string, maxLength: 128}
        lab_devices: {type: integer, minimum: 0}
        adapters:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [interface, monitor_supported, monitor_alongside_ap, access_point, in_use, bands, channels]
            properties:
              interface: {type: string, maxLength: 15}
              phy: {type: string, maxLength: 16}
              monitor_supported: {type: boolean}
              monitor_alongside_ap: {type: boolean}
              access_point: {type: boolean}
              in_use: {type: boolean, description: The adapter carries the host's own connection and is never taken over.}
              bands: {type: array, items: {type: string, enum: [2.4GHz, 5GHz, 6GHz]}}
              channels: {type: array, items: {type: integer}}
        last_error: {type: string, maxLength: 512}
        nearby_retention_hours: {type: integer, minimum: 1}
        checked_at: {type: string, format: date-time}
        notes: {type: array, items: {type: string}}
    TrafficPolicyDocument:
      type: object
      additionalProperties: false
      required: [schema, policy, digest, applied_at]
      properties:
        schema: {const: 1}
        policy: {$ref: "#/components/schemas/TrafficPolicy"}
        digest: {type: string, pattern: "^[a-f0-9]{64}$"}
        applied_at: {type: string, format: date-time}
        previous: {$ref: "#/components/schemas/TrafficPolicy"}
    TrafficFirewallPreview:
      type: object
      additionalProperties: false
      required: [filter_rules, nat_rules, needs_input_hook, needs_nat_prerouting_hook, needs_dns_service, needs_mitm_service]
      properties:
        filter_rules: {type: array, maxItems: 4096, items: {type: string, maxLength: 1024}}
        nat_rules: {type: array, maxItems: 4096, items: {type: string, maxLength: 1024}}
        needs_input_hook: {type: boolean}
        needs_nat_prerouting_hook: {type: boolean}
        needs_dns_service: {type: boolean}
        needs_mitm_service: {type: boolean}
        filter_rules_ipv6: {type: array, maxItems: 4096, items: {type: string, maxLength: 1024}}
        nat_rules_ipv6: {type: array, maxItems: 4096, items: {type: string, maxLength: 1024}}
        needs_onboarding_service: {type: boolean}
        unmatched_devices: {type: array, maxItems: 512, items: {type: string}, description: Devices with controls but no known MAC or IP yet.}
    TrafficPolicyPreview:
      type: object
      additionalProperties: false
      required: [policy, digest, firewall, changed_objects, warnings]
      properties:
        policy: {$ref: "#/components/schemas/TrafficPolicy"}
        digest: {type: string, pattern: "^[a-f0-9]{64}$"}
        firewall: {$ref: "#/components/schemas/TrafficFirewallPreview"}
        changed_objects: {type: array, minItems: 2, maxItems: 8, uniqueItems: true, items: {type: string, maxLength: 256}}
        warnings: {type: array, maxItems: 8, items: {type: string, maxLength: 512}}
    ApplyTrafficPolicyRequest:
      type: object
      additionalProperties: false
      description: password is needed every time the policy turns on HTTPS decryption for every client (tls_interception.enabled with no selected_device_ids) while it was not already on; otherwise a recent confirmation is enough.
      required: [expected_revision, policy]
      properties:
        expected_revision: {type: integer, minimum: 1}
        policy: {$ref: "#/components/schemas/TrafficPolicy"}
        password: {type: string, minLength: 1, maxLength: 1024}
    RollbackTrafficPolicyRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: {type: integer, minimum: 1}
        password: {type: string, minLength: 1, maxLength: 1024}
    ResolverCatalog:
      type: object
      additionalProperties: false
      required: [schema, revision, generated_at, resolvers]
      properties:
        schema: {const: 1}
        revision: {type: string, minLength: 1, maxLength: 64}
        generated_at: {type: string, format: date-time}
        resolvers:
          type: array
          maxItems: 512
          items:
            type: object
            additionalProperties: false
            required: [id, provider, hostnames, transports, dedicated_ips, safe_for_ip_block, source]
            properties:
              id: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$"}
              provider: {type: string, minLength: 1, maxLength: 128}
              hostnames: {type: array, maxItems: 64, items: {type: string, maxLength: 253}}
              ipv4: {type: array, maxItems: 64, items: {type: string, format: ipv4}}
              ipv6: {type: array, maxItems: 64, items: {type: string, format: ipv6}}
              doh_paths: {type: array, maxItems: 32, items: {type: string, maxLength: 256}}
              transports: {type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: {type: string, enum: [DOH, DOH3, DOT, DOQ]}}
              dedicated_ips: {type: boolean}
              safe_for_ip_block: {type: boolean}
              source: {type: string, minLength: 1, maxLength: 256}
    QueryMetadata:
      type: object
      additionalProperties: false
      required: [schema, max_query_bytes, max_tokens, max_depth, fields]
      properties:
        schema: {type: integer, const: 1}
        max_query_bytes: {type: integer, minimum: 1, maximum: 2048}
        max_tokens: {type: integer, minimum: 1, maximum: 128}
        max_depth: {type: integer, minimum: 1, maximum: 12}
        fields: {type: array, minItems: 1, maxItems: 64, items: {$ref: "#/components/schemas/QueryFieldMetadata"}}
    QueryFieldMetadata:
      type: object
      additionalProperties: false
      required: [name, value_type, operators, suggestions, wildcard]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        aliases: {type: array, maxItems: 8, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 64}}
        value_type: {type: string, enum: [enum, enum_text, text, boolean, hostname, protocol, device_id, device_name, device_tag, capture_id, ip_or_cidr, port, bytes, percentage, time, http_method, http_status, http_path]}
        operators: {type: array, minItems: 1, maxItems: 6, uniqueItems: true, items: {type: string, enum: ["=", "!=", ">", ">=", "<", "<="]}}
        enum_values: {type: array, maxItems: 256, uniqueItems: true, items: {type: string, maxLength: 128}}
        suggestions: {type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 256}}
        wildcard: {type: boolean}
    QueryValueCompletionPage:
      type: object
      additionalProperties: false
      required: [schema, field, prefix, values, truncated]
      properties:
        schema: {type: integer, const: 1}
        field: {type: string, enum: [device.name, device.tag]}
        prefix: {type: string, maxLength: 128}
        values: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/QueryValueCompletion"}}
        truncated: {type: boolean}
    QueryValueCompletion:
      type: object
      additionalProperties: false
      required: [value, device_count, includes_historical]
      properties:
        value: {type: string, minLength: 1, maxLength: 128}
        device_count: {type: integer, minimum: 1, maximum: 50000}
        includes_historical: {type: boolean}
    EventQuerySnapshotInput:
      type: object
      additionalProperties: false
      required: [query, sort]
      properties:
        query: {type: string, maxLength: 2048, description: Typed traffic filter. The server returns its canonical representation.}
        sort:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
            - {type: object, additionalProperties: false, required: [field, direction], properties: {field: {const: occurred_at}, direction: {const: desc}}}
            - {type: object, additionalProperties: false, required: [field, direction], properties: {field: {const: record_id}, direction: {const: desc}}}
        expires_in_seconds: {type: integer, minimum: 60, maximum: 3600, default: 900}
    EventQuerySnapshot:
      type: object
      additionalProperties: false
      required: [schema, query_snapshot_id, canonical_query, sort, matched_count, count_relation, created_at, expires_at, dataset_watermark, snapshot_sha256, policy_version]
      properties:
        schema: {const: 1}
        query_snapshot_id: {type: string, pattern: "^qsnap-[a-f0-9]{32}$"}
        canonical_query: {type: string, maxLength: 2048}
        sort:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
            - {type: object, additionalProperties: false, required: [field, direction], properties: {field: {const: occurred_at}, direction: {const: desc}}}
            - {type: object, additionalProperties: false, required: [field, direction], properties: {field: {const: record_id}, direction: {const: desc}}}
        query_anchor: {type: string, format: date-time, description: Present when a relative time predicate was frozen.}
        matched_count: {type: integer, minimum: 0, maximum: 100000}
        count_relation: {type: string, enum: [eq, gte], description: gte means matched_count is the bounded lower limit rather than an exact total.}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        dataset_watermark: {$ref: "#/components/schemas/EventDatasetWatermark"}
        snapshot_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        policy_version: {const: event-query-v1}
    EventDatasetWatermark:
      type: object
      additionalProperties: false
      required: [ingest_sequence, received_at, record_id]
      properties:
        ingest_sequence: {type: integer, minimum: 0, description: Authoritative monotonic database-assigned ingestion boundary.}
        received_at: {type: string, format: date-time}
        record_id: {type: string, pattern: "^[a-f0-9]{64}$"}
    SavedViewConfiguration:
      type: object
      additionalProperties: false
      required: [scope, name, page, time_behavior, sort, columns, pinned_columns, density, chart]
      properties:
        scope: {type: string, enum: [personal, shared]}
        name: {type: string, minLength: 1, maxLength: 96}
        description: {type: string, maxLength: 512}
        page: {const: live-traffic}
        canonical_query: {type: string, maxLength: 2048}
        time_behavior: {$ref: "#/components/schemas/SavedViewTimeBehavior"}
        sort: {type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: {$ref: "#/components/schemas/SavedViewSort"}}
        columns: {type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: {type: string, enum: [source, occurred_at, received_at, kind, device, network, protocol, service, bytes, confidence, capture, flow]}}
        pinned_columns: {type: array, maxItems: 3, uniqueItems: true, items: {type: string}}
        density: {type: string, enum: [comfortable, compact]}
        chart: {$ref: "#/components/schemas/SavedViewChart"}
    SavedViewTimeBehavior:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {type: string, enum: [query, rolling, absolute]}
        rolling_window: {type: string, enum: [15m, 1h, 6h, 24h, 7d]}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
    SavedViewSort:
      type: object
      additionalProperties: false
      required: [field, direction]
      properties:
        field: {type: string, enum: [occurred_at, received_at, source, kind, device, source_ip, destination_ip, protocol, service, network_bytes, confidence]}
        direction: {type: string, enum: [asc, desc]}
    SavedViewChart:
      type: object
      additionalProperties: false
      required: [visible]
      properties:
        visible: {type: boolean}
        metric: {type: string, enum: [events]}
        interval: {type: string, enum: [1m, 5m, 15m, 1h]}
    SavedView:
      type: object
      additionalProperties: false
      required: [schema, id, scope, name, page, time_behavior, sort, columns, pinned_columns, density, chart, owner, last_editor, revision, created_at, updated_at]
      properties:
        schema: {const: 1}
        id: {type: string, pattern: "^view-[a-f0-9]{32}$"}
        scope: {type: string, enum: [personal, shared]}
        name: {type: string, minLength: 1, maxLength: 96}
        description: {type: string, maxLength: 512}
        page: {const: live-traffic}
        canonical_query: {type: string, maxLength: 2048}
        time_behavior: {$ref: "#/components/schemas/SavedViewTimeBehavior"}
        sort: {type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: {$ref: "#/components/schemas/SavedViewSort"}}
        columns: {type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: {type: string, enum: [source, occurred_at, received_at, kind, device, network, protocol, service, bytes, confidence, capture, flow]}}
        pinned_columns: {type: array, maxItems: 3, uniqueItems: true, items: {type: string}}
        density: {type: string, enum: [comfortable, compact]}
        chart: {$ref: "#/components/schemas/SavedViewChart"}
        owner: {type: string, minLength: 1, maxLength: 96}
        last_editor: {type: string, minLength: 1, maxLength: 96}
        revision: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SavedViewPage:
      type: object
      additionalProperties: false
      required: [schema, views]
      properties:
        schema: {const: 1}
        views: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/SavedView"}}
    SavedViewUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision, configuration]
      properties:
        expected_revision: {type: integer, minimum: 1}
        configuration: {$ref: "#/components/schemas/SavedViewConfiguration"}
    SavedViewExport:
      type: object
      additionalProperties: false
      required: [schema, exported_at, view]
      properties:
        schema: {const: 1}
        exported_at: {type: string, format: date-time}
        view: {$ref: "#/components/schemas/SavedViewConfiguration"}
    SavedViewHistory:
      type: object
      additionalProperties: false
      required: [schema, view_id, versions]
      properties:
        schema: {const: 1}
        view_id: {type: string, pattern: "^view-[a-f0-9]{32}$"}
        versions:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [revision, editor, changed_at, snapshot]
            properties:
              revision: {type: integer, minimum: 1}
              editor: {type: string, minLength: 1, maxLength: 96}
              changed_at: {type: string, format: date-time}
              snapshot: {$ref: "#/components/schemas/SavedView"}
    RecentEventPage:
      type: object
      additionalProperties: false
      required: [schema, generated_at, events, live_cursor, device_labels_available]
      properties:
        schema: {type: integer, const: 1}
        generated_at: {type: string, format: date-time}
        canonical_query: {type: string, maxLength: 2048}
        query_anchor: {type: string, format: date-time, description: Frozen database-time anchor returned only when canonical_query contains a relative time predicate.}
        facets: {$ref: "#/components/schemas/EventFacets"}
        next_cursor: {type: string, maxLength: 256}
        live_cursor: {type: string, maxLength: 256}
        device_labels_available: {type: boolean, description: False when inventory labels cannot be safely projected; immutable IDs remain usable.}
        events: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/RecentEvent"}}
    EventFacets:
      type: object
      additionalProperties: false
      required: [exact, matched_count, count_relation, basis, fields]
      properties:
        exact: {type: boolean, description: True only when the complete matching population was counted.}
        matched_count: {type: integer, minimum: 0, maximum: 10000, description: Exact count when count_relation is eq; bounded lower bound and sample size when it is gte.}
        count_relation: {type: string, enum: [eq, gte]}
        basis: {type: string, enum: [all_matches, newest_sample]}
        fields: {type: array, minItems: 4, maxItems: 4, items: {$ref: "#/components/schemas/EventFacet"}}
    EventFacet:
      type: object
      additionalProperties: false
      required: [field, values, other_count]
      properties:
        field: {type: string, enum: [source, kind, protocol, service]}
        values: {type: array, maxItems: 12, items: {$ref: "#/components/schemas/EventFacetValue"}}
        other_count: {type: integer, minimum: 0, maximum: 10000}
    EventFacetValue:
      type: object
      additionalProperties: false
      required: [value, count]
      properties:
        value: {type: string, maxLength: 256, description: Empty string represents missing projected metadata.}
        count: {type: integer, minimum: 1, maximum: 10000}
    LiveEventBatch:
      type: object
      additionalProperties: false
      required: [schema, generated_at, events, next_cursor, device_labels_available]
      properties:
        schema: {type: integer, const: 1}
        generated_at: {type: string, format: date-time}
        canonical_query: {type: string, maxLength: 2048}
        query_anchor: {type: string, format: date-time, description: Frozen anchor carried through the relative query's resumable cursor.}
        next_cursor: {type: string, maxLength: 256}
        device_labels_available: {type: boolean}
        events: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/RecentEvent"}}
    RecentEvent:
      type: object
      additionalProperties: false
      required: [record_id, source, kind, occurred_at, received_at, source_version, parser_version, confidence]
      properties:
        record_id: {type: string, pattern: "^[a-f0-9]{64}$"}
        source: {type: string, enum: [HOST, ZEEK, SURICATA, MITMPROXY]}
        kind: {type: string, maxLength: 256}
        occurred_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        source_version: {type: string, maxLength: 256}
        parser_version: {type: string, maxLength: 256}
        capture_session_id: {type: string, pattern: "^capture-[a-f0-9]{32}$"}
        flow_id: {type: string, maxLength: 256}
        device_id: {type: string, pattern: "^device-[a-f0-9]{32}$"}
        device_friendly_name: {type: string, maxLength: 128}
        device_friendly_name_at_capture: {type: string, maxLength: 128}
        device_friendly_name_at_capture_known: {type: boolean}
        device_alias_revision: {type: integer, minimum: 0}
        device_friendly_name_conflict: {type: boolean}
        attribution_evidence: {$ref: "#/components/schemas/AttributionEvidence"}
        confidence: {type: integer, minimum: 0, maximum: 100}
        source_ip: {type: string}
        destination_ip: {type: string}
        source_port: {type: integer, minimum: 1, maximum: 65535}
        destination_port: {type: integer, minimum: 1, maximum: 65535}
        protocol: {type: string, maxLength: 64}
        service: {type: string, maxLength: 64}
        network_bytes: {type: integer, minimum: 0}
        dns_query: {type: string, minLength: 1, maxLength: 253, description: Normalized observed query name from a known Zeek or Suricata DNS schema; no enforcement outcome is implied.}
        dns_record_type: {type: string, minLength: 1, maxLength: 32}
        dns_response_code: {type: string, minLength: 1, maxLength: 32}
        dns_answer_count: {type: integer, minimum: 0, maximum: 10000}
        dns_answers: {type: array, maxItems: 8, items: {type: string, minLength: 1, maxLength: 255}, description: "What the lookup resolved to, in answer order: IP addresses in canonical form and lower-case DNS names (CNAME targets). At most 8; other record data is not included."}
        blocked: {type: boolean, description: "ShakerProxy refused this lookup (NXDOMAIN on purpose) or connection (shakerproxy.blocked)."}
        blocked_reason: {type: string, enum: [device-domain, doh-name, canary, dot, doq, doh-ip, doh3-ip], description: "Why it was refused: a domain blocked for the device, a DNS-over-HTTPS/TLS resolver name, an encrypted-DNS canary name, DNS over TLS (853/tcp), DNS over QUIC (853/udp), or a known DoH resolver address over TCP or UDP 443."}
        dns_name: {type: string, minLength: 1, maxLength: 253, description: "For a connection reported by the gateway (kind shakerproxy.conn), the name the client looked up and got this destination address for, from its own recent DNS answers."}
        detection_type: {type: string, enum: [ROGUE_DHCP, ROGUE_RA, GATEWAY_SPOOF_SUSPECTED, CLOCK_DRIFT, CAPTURE_DEGRADED, STORAGE_PRESSURE, CPU_PRESSURE, MEMORY_PRESSURE]}
        detection_severity: {type: string, enum: [WARNING, HIGH, CRITICAL]}
        detection_state: {type: string, enum: [OPEN, RESOLVED]}
        detection_summary: {type: string, minLength: 1, maxLength: 256}
        detection_scope: {type: string, minLength: 1, maxLength: 256}
        tls_server_name: {type: string, minLength: 1, maxLength: 253, description: SNI from a ShakerProxy interception outcome or observed passively by Zeek/Suricata (TLS and QUIC).}
        tls_interception_state: {type: string, enum: [INTERCEPTED, BYPASSED, FAILED]}
        tls_failure_reason: {type: string, maxLength: 96}
        tls_pinning_suspected: {type: boolean}
        tls_client_recent_success: {type: boolean}
        tls_bypass_activated: {type: boolean}
        tls_platform: {type: string, enum: [android, android-tv, ios, tvos]}
        app_protocol: {type: string, maxLength: 64, description: Protocol catalog ID (see /protocols/catalog) assigned at ingest.}
        protocol_category: {type: string, maxLength: 64}
        protocol_visibility: {$ref: "#/components/schemas/ProtocolVisibility"}
        protocol_evidence: {$ref: "#/components/schemas/ProtocolEvidence"}
        protocol_exotic: {type: boolean}
        http_method: {type: string, maxLength: 32}
        http_host: {type: string, maxLength: 253}
        http_path: {type: string, maxLength: 256, description: Request path without query string or fragment, truncated to 256 bytes.}
        http_status: {type: integer, minimum: 100, maximum: 599}
        alert_signature: {type: string, maxLength: 256}
        alert_severity: {type: integer, minimum: 1, maximum: 4, description: Suricata severity; 1 is highest.}
        alert_category: {type: string, maxLength: 128}
        bytes_sent: {type: integer, minimum: 0, maximum: 1125899906842624, description: "Bytes the connection's source sent (Zeek conn orig_bytes, Suricata flow bytes_toserver); absent when the analyzer did not record it."}
        bytes_received: {type: integer, minimum: 0, maximum: 1125899906842624, description: "Bytes the connection's destination sent back (Zeek conn resp_bytes, Suricata flow bytes_toclient)."}
        destination_organization: {type: string, maxLength: 128, description: "Who operates the destination the event names (server name, web host, looked-up name), from ShakerProxy's curated domain table, e.g. Google or Amazon; absent when unknown."}
        destination_category: {type: string, enum: [analytics, advertising, crash-reporting, telemetry, cloud-platform, cdn, push, os-services, streaming, iot-cloud], description: What the destination is used for; present only with destination_organization.}
        summary: {type: string, maxLength: 640, description: "One plain-language line of at most 160 characters, e.g. \"DNS lookup api.example.com (A) → 3 answers\" or \"HTTPS api.example.com — decrypted\". Never contains headers, bodies, credentials, or query strings."}
        wifi:
          type: object
          additionalProperties: false
          required: [scope]
          description: "What a Wi-Fi event (kind wifi.probe, wifi.auth, wifi.assoc, wifi.deauth, wifi.disassoc, wifi.beacon_summary) says. Every string came off the air and is untrusted."
          properties:
            scope: {type: string, enum: [lab, nearby]}
            client_mac: {type: string, maxLength: 17}
            randomized_mac: {type: boolean}
            bssid: {type: string, maxLength: 17}
            ssid: {type: string, maxLength: 128}
            wildcard: {type: boolean}
            hidden: {type: boolean}
            channel: {type: integer, minimum: 0}
            frequency_mhz: {type: integer, minimum: 0}
            signal_dbm: {type: integer, minimum: -120, maximum: -1}
            signal_min_dbm: {type: integer, minimum: -120, maximum: -1}
            signal_max_dbm: {type: integer, minimum: -120, maximum: -1}
            count: {type: integer, minimum: 0}
            direction: {type: string, enum: [from_client, from_ap]}
            reason_code: {type: integer, minimum: 0}
            reason: {type: string, maxLength: 96}
            protected: {type: boolean}
            status_code: {type: integer, minimum: 0}
            status: {type: string, maxLength: 96}
            success: {type: boolean}
            no_response: {type: boolean}
            algorithm: {type: string, maxLength: 32}
            reassociation: {type: boolean}
            previous_bssid: {type: string, maxLength: 17}
            security: {type: string, maxLength: 32}
            possible_mac: {type: string, maxLength: 17, description: The lab device address a randomized probe probably belongs to (low confidence).}
    ProtocolVisibility:
      type: string
      enum: [DECRYPTED, CLEARTEXT, ENCRYPTED_METADATA, OPAQUE]
      description: "DECRYPTED: ShakerProxy decrypted it. CLEARTEXT: readable on the wire. ENCRYPTED_METADATA: encrypted, but handshake metadata such as SNI is visible. OPAQUE: ShakerProxy cannot see what it carries (VPNs, proprietary or unidentified traffic)."
    ProtocolEvidence:
      type: string
      enum: [ANALYZER, PORT_HEURISTIC, UNCLASSIFIED]
      description: "ANALYZER: Zeek/Suricata/mitmproxy recognized the protocol from payload. PORT_HEURISTIC: only a well-known port matched. UNCLASSIFIED: neither matched."
    StreamTypeCounts:
      type: object
      additionalProperties: false
      required: [dns, tls, quic, http, discovery, wifi, alert, other, blocked]
      properties:
        dns: {type: integer, minimum: 0}
        tls: {type: integer, minimum: 0}
        quic: {type: integer, minimum: 0}
        http: {type: integer, minimum: 0}
        discovery: {type: integer, minimum: 0}
        wifi: {type: integer, minimum: 0}
        alert: {type: integer, minimum: 0}
        other: {type: integer, minimum: 0}
        blocked: {type: integer, minimum: 0}
    EventSummary:
      type: object
      additionalProperties: false
      required: [schema, generated_at, from, to, bucket_seconds, buckets, totals, facets]
      properties:
        schema: {const: 1}
        generated_at: {type: string, format: date-time}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        bucket_seconds: {type: number, exclusiveMinimum: 0}
        buckets:
          type: array
          maxItems: 240
          items:
            type: object
            additionalProperties: false
            required: [start, counts]
            properties:
              start: {type: string, format: date-time}
              counts: {$ref: "#/components/schemas/StreamTypeCounts"}
        totals:
          type: object
          additionalProperties: false
          required: [events, bytes_sent, bytes_received, types]
          properties:
            events: {type: integer, minimum: 0}
            bytes_sent: {type: integer, minimum: 0, description: What devices sent, from Zeek connection and Suricata flow records.}
            bytes_received: {type: integer, minimum: 0}
            types: {$ref: "#/components/schemas/StreamTypeCounts"}
        facets:
          type: array
          description: "In this order: device, type, organization, category, destination_port, app_protocol."
          items:
            type: object
            additionalProperties: false
            required: [field, values, other_count, exact]
            properties:
              field: {type: string, enum: [device, type, organization, category, destination_port, app_protocol]}
              values:
                type: array
                maxItems: 20
                items:
                  type: object
                  additionalProperties: false
                  required: [value, count]
                  properties:
                    value: {type: string, description: "A device ID, or ip:<address> for traffic not attributed to a device; a stream type; an organization or category name; a port; an app protocol."}
                    label: {type: string, description: The device's friendly name, or the address of unattributed traffic.}
                    count: {type: integer, minimum: 1}
              other_count: {type: integer, minimum: 0, description: Events (sampled events for a sampled facet) not in values, including those without a value.}
              exact: {type: boolean}
              sampled_events: {type: integer, minimum: 1, maximum: 20000, description: Present when exact is false.}
        canonical_query: {type: string}
    ProtocolSummary:
      type: object
      additionalProperties: false
      required: [schema, generated_at, window, window_start, window_end, protocols, coverage, sources, truncated]
      properties:
        schema: {const: 1}
        generated_at: {type: string, format: date-time}
        window: {type: string, enum: [1h, 24h, 7d, 30d]}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        device_id: {type: string, pattern: "^device-[a-f0-9]{32}$", description: Present only when the summary is filtered to one device.}
        protocols: {type: array, maxItems: 256, items: {$ref: "#/components/schemas/ProtocolUsage"}}
        coverage: {$ref: "#/components/schemas/ProtocolCoverage"}
        sources: {type: array, maxItems: 4, description: Which data sources contributed in the window. Without ZEEK or SURICATA only intercepted traffic is visible; start a capture for passive analysis., items: {type: string, enum: [ZEEK, SURICATA, MITMPROXY, HOST]}}
        truncated: {type: boolean}
    ProtocolUsage:
      type: object
      additionalProperties: false
      required: [protocol, label, category, visibility, evidence, exotic, novel, description, flows, bytes, events, device_count, devices, unattributed_flows, first_seen, last_seen, ports]
      properties:
        protocol: {type: string, maxLength: 64}
        label: {type: string}
        category: {type: string}
        visibility: {$ref: "#/components/schemas/ProtocolVisibility"}
        evidence: {$ref: "#/components/schemas/ProtocolEvidence"}
        exotic: {type: boolean}
        novel: {type: boolean, description: The protocol's first observation on this appliance (all retained history) falls in the window.}
        description: {type: string}
        flows: {type: integer, minimum: 0}
        bytes: {type: integer, minimum: 0}
        events: {type: integer, minimum: 1, description: Every record that identified the protocol, including application-layer evidence that is not a flow.}
        device_count: {type: integer, minimum: 0}
        devices: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/ProtocolDeviceUsage"}}
        unattributed_flows: {type: integer, minimum: 0}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
        ports: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/ProtocolPortUsage"}}
    ProtocolDeviceUsage:
      type: object
      additionalProperties: false
      required: [device_id, device_name, flows, bytes, last_seen]
      properties:
        device_id: {type: string, pattern: "^device-[a-f0-9]{32}$"}
        device_name: {type: string, maxLength: 256, description: Current friendly name, empty when the device has none.}
        flows: {type: integer, minimum: 0}
        bytes: {type: integer, minimum: 0}
        last_seen: {type: string, format: date-time}
    ProtocolPortUsage:
      type: object
      additionalProperties: false
      required: [transport, port, flows]
      properties:
        transport: {type: string, maxLength: 64}
        port: {type: integer, minimum: 1, maximum: 65535}
        flows: {type: integer, minimum: 1}
    ProtocolCoverage:
      type: object
      additionalProperties: false
      required: [total_bytes, decrypted_bytes, cleartext_bytes, encrypted_metadata_bytes, opaque_bytes, opaque_percent]
      properties:
        total_bytes: {type: integer, minimum: 0}
        decrypted_bytes: {type: integer, minimum: 0}
        cleartext_bytes: {type: integer, minimum: 0}
        encrypted_metadata_bytes: {type: integer, minimum: 0}
        opaque_bytes: {type: integer, minimum: 0}
        opaque_percent: {type: number, minimum: 0, maximum: 100}

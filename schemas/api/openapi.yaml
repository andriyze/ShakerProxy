        actor: {type: string, minLength: 1, maxLength: 96}
        engine: {type: string, enum: [ZEEK, SURICATA]}
        capture_session_id: {type: string, pattern: "^capture-[a-f0-9]{32}$"}
        deletion_operation_id: {type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}
        deletion_preview_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        target_manifest_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        state: {type: string, enum: [AUTHORIZED, COMPLETED]}
        authorized_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        replayed: {type: boolean}
    AliasChange:
      type: object
      additionalProperties: false
      required: [revision, friendly_name, previous_friendly_name, actor, reason, changed_at]
      properties:
        revision: {type: integer, minimum: 1}
        friendly_name: {type: string, maxLength: 128}
        previous_friendly_name: {type: string, maxLength: 128}
        actor: {type: string, minLength: 1, maxLength: 96}
        reason: {type: string, minLength: 1, maxLength: 256}
        changed_at: {type: string, format: date-time}
    DeviceAliasUpdateRequest:
      type: object
      additionalProperties: false
      required: [friendly_name, reason, expected_revision]
      properties:
        password: {type: string, minLength: 1, maxLength: 1024}
        friendly_name: {type: string, maxLength: 128}
        reason: {type: string, minLength: 1, maxLength: 256}
        expected_revision: {type: integer, minimum: 0}
    DeviceMetadataUpdateRequest:
      type: object
      additionalProperties: false
      description: Include at least one field. A request matching the stored values returns 200 with unchanged true.
      properties:
        password: {type: string, minLength: 1, maxLength: 1024}
        friendly_name: {type: string, maxLength: 128}
        owner: {type: string, maxLength: 128}
        location: {type: string, maxLength: 128}
        category: {type: string, maxLength: 64, pattern: "^$|^[a-z0-9][a-z0-9_-]{0,63}$"}
        icon: {type: string, enum: ["", device, camera, sensor, tv, speaker, phone, tablet, computer, console, router, appliance]}
        tags: {type: array, maxItems: 32, items: {type: string, minLength: 1, maxLength: 64}}
        notes: {type: string, maxLength: 4096}
    AddressAliasCreateRequest:
      type: object
      additionalProperties: false
      required: [name, prefix, interface, valid_from, priority, confidence, reason]
      properties:
        password: {type: string, minLength: 1, maxLength: 1024}
        name: {type: string, minLength: 1, maxLength: 128}
        prefix: {type: string, minLength: 3, maxLength: 64}
        interface: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,14}$"}
        vlan_id: {type: integer, minimum: 1, maximum: 4094}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        priority: {type: integer, minimum: 0, maximum: 1000}
        confidence: {type: integer, minimum: 1, maximum: 100}
        reason: {type: string, minLength: 1, maxLength: 256}
    AddressAliasUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, prefix, interface, valid_from, priority, confidence, reason, expected_revision]
      properties:
        password: {type: string, minLength: 1, maxLength: 1024}
        name: {type: string, minLength: 1, maxLength: 128}
        prefix: {type: string, minLength: 3, maxLength: 64}
        interface: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,14}$"}
        vlan_id: {type: integer, minimum: 1, maximum: 4094}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        priority: {type: integer, minimum: 0, maximum: 1000}
        confidence: {type: integer, minimum: 1, maximum: 100}
        reason: {type: string, minLength: 1, maxLength: 256}
        expected_revision: {type: integer, minimum: 1}
    AddressAliasMutationResult:
      type: object
      additionalProperties: false
      required: [schema, alias, replayed]
      properties:
        schema: {const: 1}
        alias: {$ref: "#/components/schemas/AddressAlias"}
        audit: {type: object, description: Omitted when unchanged is true.}
        replayed: {type: boolean}
        unchanged: {type: boolean}
        deleted: {type: boolean}
    HTTPExchangeHeaders:
      type: object
      additionalProperties: false
      required: [items, bytes]
      properties:
        items:
          type: array
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [name, value]
            properties:
              name: {type: string, maxLength: 256}
              value: {type: string, maxLength: 4096}
              sensitive: {type: boolean, description: Credentials and cookies; the UI masks them until revealed.}
              truncated: {type: boolean}
        bytes: {type: integer, minimum: 0}
        truncated: {type: boolean}
    HTTPExchangeBody:
      type: object
      additionalProperties: false
      required: [content_type, body_bytes, decoded_preview, preview_bytes, preview_encoding, preview, truncated, complete]
      properties:
        content_type: {type: string}
        content_encoding: {type: string}
        body_bytes: {type: integer, minimum: 0, description: Size after transfer decoding, before decompression.}
        decoded_preview: {type: boolean}
        preview_bytes: {type: integer, minimum: 0, maximum: 65536}
        preview_encoding: {type: string, enum: [utf-8, hex]}
        preview: {type: string, description: Text, or a hexdump -C style dump of the first 256 bytes. Display as inert text.}
        truncated: {type: boolean}
        complete: {type: boolean, description: False when the recording ends before the body does.}
        note: {type: string}
    HTTPExchange:
      type: object
      additionalProperties: false
      required: [schema, record_id, source, state, matched, exchanges]
      properties:
        schema: {const: 1}
        record_id: {type: string, pattern: "^[a-f0-9]{64}$"}
        source: {type: string, enum: [CAPTURE, DECRYPTED]}
        state: {type: string, enum: [AVAILABLE, UNAVAILABLE, RETRY]}
        reason: {type: string}
        matched: {type: integer, minimum: -1, description: Index of the exchange this event describes, or -1.}
        notes: {type: array, items: {type: string}}
        exposures:
          type: array
          description: "Secrets this cleartext exchange sent in the clear, by kind and location, never the value. Empty for encrypted/decrypted flows."
          items:
            type: object
            additionalProperties: false
            required: [kind, where]
            properties:
              kind: {type: string, enum: [basic-auth, form-password, token-in-url, cleartext-cookie]}
              where: {type: string, maxLength: 128}
        exchanges:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            properties:
              request:
                type: object
                additionalProperties: false
                required: [method, target, proto, headers, body]
                properties:
                  method: {type: string}
                  target: {type: string, maxLength: 8192}
                  proto: {type: string}
                  headers: {$ref: "#/components/schemas/HTTPExchangeHeaders"}
                  body: {$ref: "#/components/schemas/HTTPExchangeBody"}
              response:
                type: object
                additionalProperties: false
                required: [proto, status_code, status, headers, body]
                properties:
                  proto: {type: string}
                  status_code: {type: integer}
                  status: {type: string}
                  headers: {$ref: "#/components/schemas/HTTPExchangeHeaders"}
                  body: {$ref: "#/components/schemas/HTTPExchangeBody"}
        capture:
          type: object
          additionalProperties: false
          properties:
            session_id: {type: string, pattern: "^capture-[a-f0-9]{32}$"}
            segments_read: {type: integer, minimum: 0}
            segments_missing: {type: integer, minimum: 0}
            packets: {type: integer, minimum: 0}
            first_packet_at: {type: string, format: date-time}
            last_packet_at: {type: string, format: date-time}
            from_start: {type: boolean}
            closed: {type: boolean}
            incomplete: {type: boolean}
    DeviceMutationResult:
      type: object
      additionalProperties: false
      required: [schema, devices, replayed]
      properties:
        schema: {const: 1}
        devices: {type: array, maxItems: 2, items: {$ref: "#/components/schemas/Device"}, description: May be empty when a replayed mutation refers to a device that was later merged away.}
        audit: {type: object, description: Omitted when unchanged is true.}
        replayed: {type: boolean}
        unchanged: {type: boolean}
    DeviceAuditPage:
      type: object
      additionalProperties: false
      required: [schema, events, retained_events, archived_events]
      properties:
        schema: {const: 1}
        events: {type: array, maxItems: 500, items: {type: object}}
        next_cursor: {type: string, pattern: "^audit-[a-f0-9]{32}$"}
        retained_events: {type: integer, minimum: 0}
        archived_events: {type: integer, minimum: 0}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, maxLength: 96}
        password: {type: string, maxLength: 1024}
    SessionResponse:
      type: object
      additionalProperties: false
      required: [session_token, expires_at, expires_in_seconds, absolute_expires_at, idle_timeout_seconds]
      properties:
        session_token: {type: string}
        expires_at: {type: string, format: date-time, description: Current idle expiry; each authenticated request slides it forward up to absolute_expires_at.}
        expires_in_seconds: {type: integer}
        absolute_expires_at: {type: string, format: date-time}
        idle_timeout_seconds: {const: 3600}
    RecoverRequest:
      type: object
      additionalProperties: false
      required: [username, recovery_code, new_password]
      properties:
        username: {type: string, maxLength: 96}
        recovery_code: {type: string, maxLength: 64}
        new_password: {type: string, minLength: 14, maxLength: 1024}
    RecoverResponse:
      allOf:
        - {$ref: "#/components/schemas/SessionResponse"}
        - type: object
          required: [schema, remaining_recovery_codes]
          properties:
            schema: {const: 1}
            remaining_recovery_codes: {type: integer, minimum: 0}
    APIIndex:
      type: object
      additionalProperties: false
      required: [schema, name, version, openapi, authentication, resources]
      properties:
        schema: {const: 1}
        name: {type: string}
        version: {type: string}
        openapi: {type: string}
        authentication: {type: object, additionalProperties: {type: string}}
        resources:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, methods, description]
            properties:
              path: {type: string}
              methods: {type: array, items: {type: string}}
              description: {type: string}
    DeviceIdentity:
      type: object
      additionalProperties: false
      required: [kind, value, source, confidence, first_seen, last_seen]
      properties:
        kind: {type: string, enum: [MAC, DHCP_CLIENT_ID]}
        value: {type: string}
        source: {type: string, enum: [DHCP4_LEASE, OBSERVED_DHCP, OBSERVED_LAN, NDP, ARP, PINNED_ADDRESS]}
        confidence: {type: integer, minimum: 1, maximum: 100}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
    AddressObservation:
      type: object
      additionalProperties: false
      required: [address, family, source, confidence, valid_from, valid_until, observed_at, active]
      properties:
        address: {type: string, format: ipv4}
        family: {const: IPv4}
        source: {type: string, enum: [DHCP4_LEASE, OBSERVED_DHCP, OBSERVED_LAN, NDP, ARP, PINNED_ADDRESS]}
        confidence: {type: integer, minimum: 1, maximum: 100}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        observed_at: {type: string, format: date-time}
        active: {type: boolean}
        interface: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,14}$", description: Confirmed lab interface for this lease interval. Omitted for legacy or unavailable scope evidence.}
        vlan_id: {type: integer, minimum: 1, maximum: 4094, description: Confirmed lab VLAN for this interval when configured.}
        scope_plan_sha256: {type: string, pattern: "^[a-f0-9]{64}$", description: SHA-256 identity of the confirmed network plan that supplied the interface and VLAN scope.}
    HostnameObservation:
      type: object
      additionalProperties: false
      required: [hostname, source, confidence, first_seen, last_seen]
      properties:
        hostname: {type: string, maxLength: 253}
        source: {type: string, enum: [DHCP4_LEASE, OBSERVED_DHCP]}
        confidence: {type: integer, minimum: 1, maximum: 100}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}

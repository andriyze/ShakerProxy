        state: {type: string, enum: [RUNNING, COMPLETED, PARTIAL, FAILED]}
        original_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        original_manifest_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        output_manifest_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        output_manifest_file_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        selection_rule: {$ref: "#/components/schemas/PCAPSelectionRule"}
        selection_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        original_bytes: {type: integer, format: int64, minimum: 28}
        expected_packets: {type: integer, format: int64, minimum: 1}
        expected_matched_packets: {type: integer, format: int64, minimum: 1}
        expected_collateral_packets: {type: integer, format: int64, minimum: 0}
        packets_read: {type: integer, format: int64, minimum: 0}
        matched_packets_removed: {type: integer, format: int64, minimum: 0}
        collateral_packets_removed: {type: integer, format: int64, minimum: 0}
        artifact_removed: {type: boolean}

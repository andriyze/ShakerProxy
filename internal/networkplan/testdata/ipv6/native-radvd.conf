# ShakerProxy router advertisements for the lab network.
# Generated from the confirmed network plan; manual edits are overwritten.
interface enp2s0
{
	AdvSendAdvert on;
	IgnoreIfMissing on;
	MinRtrAdvInterval 30;
	MaxRtrAdvInterval 120;
	AdvDefaultLifetime 600;
	AdvManagedFlag off;
	AdvOtherConfigFlag off;
	prefix 2a01:4f8:1c1c:a001::/64
	{
		AdvOnLink on;
		AdvAutonomous on;
		AdvRouterAddr off;
		AdvValidLifetime 3600;
		AdvPreferredLifetime 1800;
		DeprecatePrefix on;
	};
	RDNSS 2a01:4f8:1c1c:a001::fe 2606:4700:4700::1111
	{
		AdvRDNSSLifetime 240;
	};
};
